<!DOCTYPE html>
<html lang="es" data-i18n-title="pageTitle">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sobre la app | Routime</title>
  <!-- Linked from the main menu footer, right before "Configuración".
       Shows the achievements saved on this device. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#FAF7F2">
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" href="../assets/img/icono.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container about-app">
    <header class="cabecera-about-app">
      <div class="idioma-selector" role="group" data-i18n-aria="languageAria" aria-label="Elegir idioma">
        <button type="button" class="btn-lang" id="btnLangEs" data-locale="es" aria-pressed="false">🇪🇸 Español</button>
        <button type="button" class="btn-lang" id="btnLangEn" data-locale="en" aria-pressed="false">🇬🇧 English</button>
      </div>
      <img src="../assets/img/icono.svg" alt="" width="64" height="64" class="logo-about-app">
      <h1 data-i18n="title">ℹ️ Sobre la app</h1>
      <p class="entradilla" data-i18n="intro">Routime tiene actividades para practicar cosas del día a día. Aquí ves tus logros.</p>
    </header>

    <main class="pila">
      <section id="logros" class="card" aria-labelledby="achievementsTitle">
        <h2 id="achievementsTitle" data-i18n="achievementsTitle">⭐ Logros</h2>
        <p data-i18n="achievementsHint">Los logros llegan solos cuando juegas y ganas estrellas.</p>
        <p class="achievements-count" id="achievementsCount" aria-live="polite"></p>
        <ul class="achievements-grid" id="achievementsGrid"></ul>
      </section>

      <p class="nota-local" data-i18n="savedLocally">Tus logros se guardan solo en este dispositivo.</p>
    </main>

    <footer class="pie-about-app">
      <a class="btn btn-secondary" href="../site/index.html" data-i18n="footerActivities">Ir a las actividades</a>
      <a class="btn btn-secondary" href="../config/" data-i18n="core.config">Configuración</a>
      <a class="btn btn-secondary" href="../legal/index.html" data-i18n="core.dataProtection">Protección de datos</a>
    </footer>
  </div>

  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/i18n.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/achievements.js"></script>
  <script src="strings.es.js"></script>
  <script src="strings.en.js"></script>
  <script src="app.js"></script>
  <script>
    /* Register the SW from this entry point so it is active for any later
       navigation, matching what the tools and site/ pages already do. */
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../sw.js').catch(function () {});
    }
  </script>
</body>
</html>
