<!DOCTYPE html>
<html lang="es" data-i18n-title="title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Ajedrez | Routime</title>
  <meta name="theme-color" content="#FAF7F2">
  <link rel="stylesheet" href="../../assets/css/tokens.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="tool-header">
      <a href="../../site/index.html" class="back-link" data-i18n="core.back">← Volver</a>
      <h1 data-i18n="title">♟️ El Ajedrez</h1>
      <span class="stars" id="stars">⭐ 0</span>
    </header>

    <!-- Screen: menu of the 2 activities -->
    <section id="pantallaMenu" class="pila">
      <div class="fila centrado-fila">
        <p class="instruccion" id="instruccion" data-i18n="instruccion">Aquí practicas dos cosas: primero aprende cómo mueve cada pieza, y después juega una mini partida.</p>
      </div>
      <div class="grid-tarjetas">
        <button type="button" class="tarjeta-actividad" id="tarjetaPiezas">
          <span class="picto" aria-hidden="true">🏰</span>
          <span class="nombre" data-i18n="menuPiezas">Las piezas</span>
          <span class="detalle" data-i18n="menuPiezasDetalle">Aprende cómo mueve cada pieza.</span>
        </button>
        <button type="button" class="tarjeta-actividad" id="tarjetaPartida">
          <span class="picto" aria-hidden="true">⚔️</span>
          <span class="nombre" data-i18n="menuPartida">Mini partida</span>
          <span class="detalle" data-i18n="menuPartidaDetalle">Juega contra el rival. Captura su rey.</span>
        </button>
      </div>
    </section>

    <!-- ===== Actividad 1: Las piezas (puzzles de estrellas) ===== -->

    <section id="pantallaNivelesPiezas" class="oculto pila centrado">
      <div class="fila"><button type="button" class="btn btn-secundario" id="btnVolverMenuPiezas" data-i18n="volverMenu">← Menú</button></div>
      <h2 data-i18n="elegirNivel">Elige el nivel</h2>
      <div class="pila" id="nivelesPiezas"></div>
    </section>

    <section id="pantallaJuegoPiezas" class="oculto pila centrado">
      <div class="progress-bar">
        <div class="progress-fill" id="progressPiezasFill"></div>
        <span class="progress-text" id="progressPiezasText">0 / 4</span>
      </div>

      <div class="fila centrado-fila">
        <p class="estado" id="estadoPiezas" aria-live="polite"></p>
        <button type="button" class="btn btn-secundario" id="btnAyudaPiezas" data-i18n="btnAyuda">💡 Ayuda</button>
      </div>

      <div class="tablero-ajedrez" id="tableroPiezas" role="grid" data-i18n-aria="ariaTableroPiezas" aria-label="Tablero de puzzles"></div>

      <div class="fila explicacion oculto" id="ayudaPiezasWrap">
        <p id="ayudaPiezasTexto" aria-live="polite"></p>
        <button type="button" class="btn btn-audio" id="btnEscucharAyudaPiezas" data-i18n-aria="ariaEscucharAyuda" aria-label="Escuchar la ayuda">🔊</button>
      </div>

      <div class="feedback" id="feedbackPiezas" aria-live="polite"></div>
    </section>

    <!-- ===== Actividad 2: Mini partida ===== -->

    <section id="pantallaNivelesPartida" class="oculto pila centrado">
      <div class="fila"><button type="button" class="btn btn-secundario" id="btnVolverMenuPartida" data-i18n="volverMenu">← Menú</button></div>
      <div class="fila centrado-fila">
        <p class="instruccion" data-i18n="instruccionPartida">Tú llevas las piezas blancas. Captura el rey del rival ♚ y protege el tuyo ♔.</p>
      </div>
      <h2 data-i18n="elegirNivel">Elige el nivel</h2>
      <div class="pila" id="nivelesPartida"></div>
    </section>

    <section id="pantallaJuegoPartida" class="oculto pila centrado">
      <div class="fila centrado-fila">
        <p class="estado" id="estadoPartida" aria-live="polite"></p>
        <button type="button" class="btn btn-secundario" id="btnAyudaPartida" data-i18n="btnAyuda">💡 Ayuda</button>
      </div>

      <div class="tablero-ajedrez" id="tableroPartida" role="grid" data-i18n-aria="ariaTableroPartida" aria-label="Tablero de ajedrez"></div>

      <div class="fila explicacion oculto" id="ayudaPartidaWrap">
        <p id="ayudaPartidaTexto" aria-live="polite"></p>
        <button type="button" class="btn btn-audio" id="btnEscucharAyudaPartida" data-i18n-aria="ariaEscucharAyuda" aria-label="Escuchar la ayuda">🔊</button>
      </div>

      <div class="feedback" id="feedbackPartida" aria-live="polite"></div>
      <div class="fila centrado-fila">
        <button type="button" class="btn oculto" id="btnOtraPartida" data-i18n="jugarOtraVez">Jugar otra vez</button>
        <button type="button" class="btn btn-secundario" id="btnSalirPartida" data-i18n="btnOtroNivel">Elegir otro nivel</button>
      </div>
    </section>

    <!-- Pantalla final de ronda (Las piezas) -->
    <section id="pantallaFinal" class="oculto centrado pila" aria-live="polite">
      <div class="emoji-grande" aria-hidden="true">🎉</div>
      <h2 data-i18n="core.roundComplete">¡Ronda completada!</h2>
      <p id="resumenFinal"></p>
      <p id="transferencia" class="transferencia" data-i18n="transferencia"></p>
      <button type="button" class="btn" id="btnRepetir" data-i18n="core.playAgain">Jugar otra vez</button>
      <button type="button" class="btn btn-secundario" id="btnOtroNivelFinal" data-i18n="btnOtroNivel">Elegir otro nivel</button>
      <button type="button" class="btn btn-secundario" id="btnVolverMenuFinal" data-i18n="volverMenu">← Menú</button>
    </section>
    <footer data-pie-app data-pie-base="../../" data-pie-class="pie-app"></footer>
  </div>

  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script src="../../assets/js/tts.js"></script>
  <script src="../../assets/js/storage.js"></script>
  <script src="../../assets/js/feedback.js"></script>
  <script src="strings.es.js"></script>
  <script src="strings.en.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../../sw.js').catch(function () {});
    }
  </script>
</body>
</html>
