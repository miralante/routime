<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de tareas | Routime</title>
  <meta name="theme-color" content="#FAF7F2">
  <link rel="stylesheet" href="../../assets/css/tokens.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="tool-header">
      <a href="../../site/index.html" class="back-link">&larr; Volver</a>
      <h1>Routime</h1>
      <span class="stars" id="stars">&starf; 0</span>
    </header>

    <section id="startScreen" class="hidden pila centered">
      <div class="row centered-row">
        <p class="instruccion" data-i18n="instruccion">Pulsa Jugar para empezar.</p>
      </div>
      <button type="button" class="btn btn-principal" id="btnPlay">
        <span data-i18n="btnJugar">Jugar!</span>
      </button>
    </section>

    <section id="gameScreen" class="hidden pila centered">

      <div class="create-screen hidden" id="createScreen">
        <h3>Crear tu lista</h3>
        <input type="text" id="inputNombreListaCrear" placeholder-text="Nombre de la lista" />
        <button type="button" class="btn btn-secondary" id="btnAnadirItemCrear">Anadir</button>
        <input type="text" id="inputNuevoItemCrear" placeholder-text="Nuevo item" />
        <div id="itemsListaCrear" class="items-crear"></div>
        <p id="progresoListaCrear"></p>
        <button type="button" class="btn" id="btnGuardarListaCrear">Guardar</button>
        <button type="button" class="btn btn-secondary" id="btnVaciarListaCrear">Vaciar</button>
        <button type="button" class="btn btn-secondary" id="btnMisListas">Mis listas</button>
        <div id="savedLists" class="saved-lists"></div>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
        <span class="progress-text" id="progressText"></span>
        <span class="dificultad" id="level"></span>
      </div>
      <div class="card centered stack">
        <h3 id="listaTitulo" class="lista-titulo"></h3>
        <div id="secuencia" class="secuencia-row"></div>
        <div id="disponibles" class="disponibles-row"></div>
        <div class="crear-controles">
          <button type="button" class="btn btn-secondary" id="btnSubirItemCrear">Subir</button>
          <button type="button" class="btn btn-secondary" id="btnBajarItemCrear">Bajar</button>
        </div>
        <p id="feedbackCrear" class="feedback"></p>
      </div>
      <div class="feedback" id="feedback" aria-live="polite"></div>
      <button type="button" class="btn hidden" id="btnNext">Siguiente &#8594;</button>
    </section>

      <section id="endScreen" class="hidden centered pila" aria-live="polite">
        <div class="emoji-grande" aria-hidden="true">&#x1F38A;</div>
        <h2>Ronda completada!</h2>
        <p id="endSummary"></p>
        <p class="transferencia">Sigue praticando para aprender mas.</p>
        <button type="button" class="btn" id="repeatBtn">Jugar otra vez</button>
        <button type="button" class="btn btn-secondary" id="btnMenu">Volver al inicio</button>
        <a href="../../site/index.html" class="btn btn-secondary">Volver al menu</a>
      </section>
    <footer data-pie-app data-pie-base="../../" data-pie-class="pie-app"></footer>
  </div>

  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script src="../../assets/js/storage.js"></script>
  <script src="../../assets/js/feedback.js"></script>
  <script src="strings.es.js"></script>
  <script src="strings.en.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register("../../sw.js").catch(function () {});
    }
  </script>
</body>
</html>
