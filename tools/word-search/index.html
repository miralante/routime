<!DOCTYPE html>
<html lang="es" data-i18n-title="title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sopa de Letras | Routime</title>
  <meta name="theme-color" content="#FAF7F2">
  <link rel="stylesheet" href="../../assets/css/tokens.css?v=routime-vbb11c750">
  <link rel="stylesheet" href="../../assets/css/base.css?v=routime-v24767fa6">
  <link rel="stylesheet" href="../../assets/css/components.css?v=routime-v962b12ea">
  <link rel="stylesheet" href="styles.css?v=routime-v24a4828a">
</head>
<body>
  <div class="container">
    <header class="tool-header">
      <a href="../../" class="back-link" data-i18n="core.back">← Volver</a>
      <h1 data-i18n="title">🔍 Sopa de Letras</h1>
      <span class="stars" id="stars">⭐ 0</span>
    </header>

    <!-- Start screen: choose a topic -->
    <section id="startScreen" class="pila centered">
      <div class="fila center-row">
        <p class="instruction" data-i18n="instruction">Busca las palabras escondidas entre las letras.</p>
      </div>
      <h2 data-i18n="chooseTopic">Elige un tema</h2>
      <div class="pila" id="topics"></div>
    </section>

    <!-- Game screen -->
    <section id="gameScreen" class="hidden pila">
      <div class="fila center-row">
        <span class="dificultad" id="dificultad" aria-live="polite"></span>
      </div>
      <div class="fila center-row">
        <p class="instruction" data-i18n="howToPlay">Toca la primera letra y la última letra de la palabra.</p>
      </div>
      <h2 class="words-title" data-i18n="wordsTitle">Palabras que buscas:</h2>
      <div class="fila center-row" id="wordList"></div>
      <div class="board" id="board" role="grid" aria-label="Sopa de letras"></div>
      <div class="fila center-row">
        <button type="button" class="btn btn-secondary btn-hint" id="hintBtn" data-i18n="hint">💡 Pista</button>
      </div>
      <div class="feedback" id="feedback" aria-live="polite"></div>
    </section>

    <!-- End screen -->
    <section id="endScreen" class="hidden centered pila" aria-live="polite">
      <div class="big-emoji" aria-hidden="true">🎉</div>
      <h2 data-i18n="core.roundComplete">¡Ronda completada!</h2>
      <p id="finalSummary"></p>
      <p id="transferencia" class="transferencia" data-i18n="transferencia"></p>
      <button type="button" class="btn" id="btnRepeat" data-i18n="core.playAgain">Jugar otra vez</button>
      <a href="../../" class="btn btn-secondary" data-i18n="core.backToMenu">Volver al menú</a>
    </section>
    <footer data-pie-app data-pie-base="../../" data-pie-class="pie-app"></footer>
  </div>

  <script src="../../assets/js/utils.js?v=routime-v32a47fbd"></script>
  <script src="../../assets/js/i18n.js?v=routime-v729f90fb"></script>
  <script src="../../assets/js/storage.js?v=routime-veaa669aa"></script>
  <script src="../../assets/js/feedback.js?v=routime-v93b35d8d"></script>
  <script src="strings.es.js?v=routime-vb1721f4c"></script>
  <script src="strings.en.js?v=routime-va9afa168"></script>
  <script src="data.js?v=routime-va342ef8a"></script>
  <script src="app.js?v=routime-veaf3bf85"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../../sw.js').catch(function () {});
    }
  </script>
<script src="../../assets/js/sw-update.js?v=routime-v6d6b3d4b" defer></script>
</body>
</html>
