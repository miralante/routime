<!DOCTYPE html>
<html lang="es" data-i18n-title="title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sopa de Letras | Routime</title>
  <meta name="theme-color" content="#FAF7F2">
  <link rel="stylesheet" href="../../assets/css/tokens.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="tool-header">
      <a href="../../site/index.html" class="back-link" data-i18n="core.back">← Volver</a>
      <h1 data-i18n="title">🔍 Sopa de Letras</h1>
      <span class="stars" id="stars">⭐ 0</span>
    </header>

    <!-- Start screen: choose a topic -->
    <section id="startScreen" class="pila centrado">
      <div class="fila center-row">
        <p class="instruction" data-i18n="instruction">Busca las palabras escondidas entre las letras.</p>
      </div>
      <h2 data-i18n="chooseTopic">Elige un tema</h2>
      <div class="pila" id="topics"></div>
    </section>

    <!-- Levels screen -->
    <section id="levelsScreen" class="oculto pila centrado">
      <h2 id="topicTitle"></h2>
      <p data-i18n="chooseLevel">Elige un nivel</p>
      <div class="pila" id="levels"></div>
      <button type="button" class="btn btn-secundario" id="backTopicsBtn" data-i18n="chooseAnotherTopic">Elegir otro tema</button>
    </section>

    <!-- Game screen -->
    <section id="gameScreen" class="oculto pila">
      <div class="fila center-row">
        <p class="instruction" data-i18n="howToPlay">Toca la primera letra y la última letra de la palabra.</p>
      </div>
      <h2 class="words-title" data-i18n="wordsTitle">Palabras que buscas:</h2>
      <div class="fila center-row" id="wordList"></div>
      <div class="board" id="board" role="grid" aria-label="Sopa de letras"></div>
      <div class="fila center-row">
        <button type="button" class="btn btn-secundario btn-hint" id="hintBtn" data-i18n="hint">💡 Pista</button>
      </div>
      <div class="feedback" id="feedback" aria-live="polite"></div>
    </section>

    <!-- End screen -->
    <section id="endScreen" class="oculto centrado pila" aria-live="polite">
      <div class="big-emoji" aria-hidden="true">🎉</div>
      <h2 data-i18n="core.roundComplete">¡Ronda completada!</h2>
      <p id="finalSummary"></p>
      <p id="transferencia" class="transferencia" data-i18n="transferencia"></p>
      <button type="button" class="btn" id="replayBtn" data-i18n="core.playAgain">Jugar otra vez</button>
      <button type="button" class="btn btn-secundario" id="otherLevelBtn" data-i18n="chooseAnotherLevel">Elegir otro nivel</button>
      <a href="../../site/index.html" class="btn btn-secundario" data-i18n="core.backToMenu">Volver al menú</a>
    </section>
    <footer class="pie-app">
      <a href="../../legal/index.html" class="enlace-legal" data-i18n="core.dataProtection">Protección de datos</a>
    </footer>
  </div>

  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script src="../../assets/js/tts.js"></script>
  <script src="../../assets/js/storage.js"></script>
  <script src="../../assets/js/feedback.js"></script>
  <script src="strings.es.js"></script>
  <script src="strings.en.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../../sw.js').catch(function () {});
    }
  </script>
</body>
</html>
