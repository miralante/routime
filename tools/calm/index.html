<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calm | Routime</title>
  <meta name="theme-color" content="#FAF7F2">
    <link rel="stylesheet" href="../../assets/css/brand.css">
  <link rel="stylesheet" href="../../assets/css/tokens.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/locale-picker.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div data-suite-header data-suite-logo="../../assets/img/icono.svg" data-suite-byline></div>
    <div class="suite-chrome-activity" data-suite-activity>
      <a href="../../" class="back-link">&larr; Volver</a>
      <h1>Routime</h1>
    </div>
    <main class="suite-body">
    <span class="stars" data-suite-stars id="stars">&starf; 0</span>

    <section id="startScreen" class="hidden pila centered">
      <div class="row centered-row">
        <p class="instruccion" data-i18n="instruccion">Sigue el ritmo del círculo: inhala cuando crezca y exhala cuando se encoja.</p>
      </div>
      <button type="button" class="btn btn-principal" id="btnPlay">
        <span data-i18n="btnJugar">Jugar!</span>
      </button>
    </section>

    <section id="gameScreen" class="hidden pila centered">

      <div class="breathing-circle" id="breathingCircle">
        <p class="breathing-text" id="breathingText"></p>
      </div>
      <div class="breathing-controls">
        <button type="button" class="btn btn-secondary" id="btnModoLibre">Modo libre</button>
      </div>
      <div class="feedback" id="feedback" aria-live="polite"></div>
    </section>

    <section id="endScreen" class="hidden centered pila" aria-live="polite">
      <div class="emoji-grande" aria-hidden="true">&#x1F38A;</div>
      <h2>Ronda completada!</h2>
      <p id="endSummary"></p>
      <p class="transferencia">Sigue praticando para aprender mas.</p>
      <button type="button" class="btn" id="repeatBtn">Jugar otra vez</button>
    </section>
    </main>
    <footer data-suite-footer data-suite-base="../../" data-suite-settings></footer>
  </div>

  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script src="../../assets/js/storage.js"></script>
  <script src="../../assets/js/feedback.js"></script>
  <script src="strings.es.js"></script>
  <script src="strings.en.js"></script>
  <script src="data.js"></script>
  <script src="../../assets/js/stars-engine.js"></script>
  <script src="../../assets/js/stars-strings.js"></script>
  <script src="../../assets/js/activity-glue.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register("../../sw.js").catch(function () {});
    }
  </script>
<script src="../../assets/js/sw-update.js" defer></script>
  <script src="../../assets/js/locale-picker-config.js"></script>
  <script src="../../assets/js/locale-picker.js" defer></script>
  <script src="../../assets/js/suite-chrome.js"></script>
</body>
</html>
