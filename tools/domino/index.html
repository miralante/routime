<!DOCTYPE html>
<html lang="es" data-i18n-title="title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dominó | Routime</title>
  <meta name="theme-color" content="#FAF7F2">
  <link rel="stylesheet" href="../../assets/css/tokens.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="tool-header">
      <a href="../../site/index.html" class="back-link" data-i18n="core.back">← Volver</a>
      <h1 data-i18n="title">🁵 Dominó</h1>
      <span class="stars" id="stars">⭐ 0</span>
    </header>

    <!-- Start screen -->
    <section id="pantallaInicio" class="pila centrado">
      <div class="fila centrado-fila">
        <p class="instruccion" id="instruccion" data-i18n="instruccion">Juega al dominó contra un rival tranquilo. Toca una ficha que encaje con un extremo de la cadena. Si no tienes, roba del montón.</p>
      </div>
      <h2 data-i18n="elegirNivel">Elige el nivel</h2>
      <div class="pila" id="niveles"></div>
    </section>

    <!-- Game screen -->
    <section id="pantallaJuego" class="oculto pila centrado">
      <div class="fila centrado-fila">
        <p class="estado" id="estado" aria-live="polite"></p>
      </div>

      <p class="etiqueta" data-i18n="etiquetaCadena">La mesa</p>
      <div class="cadena-marco">
        <div class="cadena" id="cadena"></div>
      </div>

      <div class="fila centrado-fila lados oculto" id="lados">
        <button type="button" class="btn" id="btnLadoIzq" data-i18n="ladoIzquierdo">⬅️ En este lado</button>
        <button type="button" class="btn" id="btnLadoDer" data-i18n="ladoDerecho">En este lado ➡️</button>
      </div>

      <div class="fila centrado-fila info-partida">
        <button type="button" class="btn btn-secundario monton" id="monton">🂠 0</button>
        <p class="rival-info" id="rivalInfo"></p>
      </div>

      <p class="etiqueta" data-i18n="etiquetaMano">Tus fichas</p>
      <div class="mano" id="mano"></div>

      <div class="feedback" id="feedback" aria-live="polite"></div>
      <p id="transferencia" class="transferencia" data-i18n="transferencia"></p>
      <div class="fila centrado-fila">
        <button type="button" class="btn oculto" id="btnOtraPartida" data-i18n="jugarOtraVez">Jugar otra vez</button>
        <button type="button" class="btn btn-secundario" id="btnSalir" data-i18n="btnOtroNivel">Elegir otro nivel</button>
      </div>
    </section>
    <footer data-pie-app data-pie-base="../../" data-pie-class="pie-app"></footer>
  </div>

  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script src="../../assets/js/tts.js"></script>
  <script src="../../assets/js/storage.js"></script>
  <script src="../../assets/js/feedback.js"></script>
  <script src="strings.es.js"></script>
  <script src="strings.en.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../../sw.js').catch(function () {});
    }
  </script>
</body>
</html>
