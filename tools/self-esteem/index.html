<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autoestima | Routime</title>
  <meta name="theme-color" content="#FAF7F2">
  <link rel="stylesheet" href="../../assets/css/tokens.css?v=routime-v32fbcfdc">
  <link rel="stylesheet" href="../../assets/css/base.css?v=routime-v24767fa6">
  <link rel="stylesheet" href="../../assets/css/components.css?v=routime-v5a9a7ad2">
  <link rel="stylesheet" href="styles.css?v=routime-v0fe9a571">
</head>
<body>
  <div class="container">
    <header class="tool-header">
      <a href="../../" class="back-link">&larr; Volver</a>
      <h1>Routime</h1>
      <span class="stars" id="stars">&starf; 0</span>
    </header>

    <section id="startScreen" class="hidden pila centered">
      <div class="row centered-row">
        <p class="instruccion" data-i18n="instruccion">Pulsa Jugar para empezar.</p>
      </div>
      <button type="button" class="btn btn-principal" id="btnPlay">
        <span data-i18n="btnJugar">Jugar!</span>
      </button>
    </section>

    <section id="gameScreen" class="hidden pila centered">

      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
        <span class="progress-text" id="progressText"></span>
        <span class="dificultad" id="level"></span>
      </div>
      <div class="card centered stack">
        <span id="situacionPicto" class="picto-situacion"></span>
        <p id="situacionTexto" class="situacion-text"></p>
        <button type="button" class="btn btn-audio" id="listenBtn">&#128266;</button>
        <button type="button" class="btn btn-secondary" id="btnListenExplanation">Escuchar explicacion</button>
      </div>
      <div class="options stack" id="options"></div>
      <div class="feedback" id="feedback" aria-live="polite"></div>
      <div class="row explanation hidden" id="explanationWrap">
        <p id="explanation" aria-live="polite"></p>
      </div>
      <button type="button" class="btn hidden" id="btnNext">Siguiente &#8594;</button>
      <button type="button" class="btn btn-secondary" id="btnVerTodas" data-i18n="verTodas">Ver todas las situaciones</button>
    </section>

      <section id="endScreen" class="hidden centered pila" aria-live="polite">
        <div class="emoji-grande" aria-hidden="true">&#x1F38A;</div>
        <h2>Ronda completada!</h2>
        <p id="endSummary"></p>
        <p class="transferencia">Sigue praticando para aprender mas.</p>
        <button type="button" class="btn" id="repeatBtn">Jugar otra vez</button>
        <button type="button" class="btn btn-secondary" id="btnVerTodasFin" data-i18n="verTodas">Ver todas las situaciones</button>
        <button type="button" class="btn btn-secondary" id="btnMenu">Volver al inicio</button>
        <a href="../../" class="btn btn-secondary">Volver al menu</a>
      </section>

      <section id="listScreen" class="hidden pila" aria-live="polite">
        <div class="row centered-row">
          <button type="button" class="btn btn-secondary" id="btnVolverJugar" data-i18n="volverJugar">Volver a jugar</button>
        </div>
        <h2 data-i18n="listaTitulo">Todas las situaciones</h2>
        <div id="listaTodas"></div>
      </section>
    <footer data-pie-app data-pie-base="../../" data-pie-class="pie-app"></footer>
  </div>

  <script src="../../assets/js/utils.js?v=routime-v7a2f4549"></script>
  <script src="../../assets/js/i18n.js?v=routime-v3208a1ba"></script>
  <script src="../../assets/js/storage.js?v=routime-va4fa64ee"></script>
  <script src="../../assets/js/feedback.js?v=routime-v688a6c9c"></script>
  <script src="strings.es.js?v=routime-v962b1c2d"></script>
  <script src="strings.en.js?v=routime-v68ded645"></script>
  <script src="data.js?v=routime-v6973553e"></script>
  <script src="../../assets/js/stars-engine.js?v=routime-v8d4a7ee6"></script>
  <script src="../../assets/js/stars-strings.js?v=routime-v37bc0c34"></script>
  <script src="../../assets/js/achievements-engine.js?v=routime-v17375744"></script>
  <script src="../../assets/js/achievements.js?v=routime-v67315faa"></script>
  <script src="../../assets/js/activity-play.js?v=routime-vf827df3c"></script>
  <script src="app.js?v=routime-v97c12298"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register("../../sw.js").catch(function () {});
    }
  </script>
<script src="../../assets/js/sw-update.js?v=routime-v6d6b3d4b" defer></script>
</body>
</html>
