<!DOCTYPE html>
<html lang="es" data-i18n-title="title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Seguro | Routime</title>
  <meta name="theme-color" content="#FAF7F2">
  <link rel="stylesheet" href="../../assets/css/tokens.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="tool-header">
      <a href="../../site/index.html" class="back-link" data-i18n="core.back">← Volver</a>
      <h1 data-i18n="title">🛡️ Chat Seguro</h1>
      <span class="stars" id="stars">⭐ 0</span>
    </header>

    <!-- Screen: chat menu -->
    <section id="menuScreen" class="pila">
      <div class="row centered-row">
        <p class="instruccion centered" id="instruccion" data-i18n="instruccion">Estos chats son de mentira. Sirven para practicar.
          Elige un chat y responde con cuidado.</p>
      </div>
      <div class="cards-grid" id="listaChats"></div>
      <div class="row centered-row">
        <button type="button" class="btn btn-secondary" id="btnNormas" data-i18n="btnNormas">📜 Mis normas</button>
      </div>
    </section>

    <!-- Pantalla: mis normas -->
    <section id="pantallaNormas" class="hidden pila">
      <div class="row">
        <button type="button" class="btn btn-secondary" id="btnVolverDeNormas" data-i18n="volverChats">← Chats</button>
        <h2 class="titulo-seccion" data-i18n="normasTitulo">Mis normas</h2>
      </div>
      <p class="instruccion" data-i18n="instruccionNormas">Estas normas te protegen en internet.</p>
      <div class="pila" id="listaNormas"></div>
    </section>

    <!-- Pantalla: chat -->
    <section id="pantallaChat" class="hidden pila">
      <div class="row">
        <button type="button" class="btn btn-secondary" id="btnSalirChat" data-i18n="volverChats">← Chats</button>
        <div class="chat-contacto">
          <span class="chat-avatar" aria-hidden="true">👤</span>
          <span class="pila-mini">
            <span class="chat-alias" id="chatAlias" data-i18n="desconocido">Desconocido</span>
            <span class="chat-badge" data-i18n="noConoces">No conoces a esta persona</span>
          </span>
        </div>
      </div>

      <div class="chat-marco">
        <div class="chat-mensajes pila" id="chatMensajes"></div>
      </div>

      <div class="feedback" id="feedback" aria-live="polite"></div>

      <div class="consejo hidden" id="consejo">
        <p id="consejoTexto"></p>
      </div>

      <div class="consejo consejo-seguro hidden" id="consejoSeguro">
        <p id="consejoSeguroTexto"></p>
      </div>

      <p class="pregunta centered hidden" id="chatPregunta" data-i18n="chatPregunta">¿Qué respondes?</p>
      <div class="pila" id="chatOpciones"></div>

      <div class="regla-final hidden" id="reglaFinal">
        <h3 data-i18n="reglaFinalTitulo">⭐ Para recordar</h3>
        <p id="reglaTexto"></p>
        <div class="row centered-row">
          <button type="button" class="btn btn-audio" id="btnRegla" data-i18n-aria="ariaEscucharNorma" aria-label="Escuchar la norma"><span data-i18n="core.listen">🔊 Escuchar</span></button>
          <button type="button" class="btn" id="btnBackToMenu" data-i18n="volverAChats">Volver a los chats</button>
        </div>
      </div>
    </section>
    <footer data-pie-app data-pie-base="../../" data-pie-class="pie-app"></footer>
  </div>

  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script src="../../assets/js/storage.js"></script>
  <script src="../../assets/js/feedback.js"></script>
  <script src="strings.es.js"></script>
  <script src="strings.en.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../../sw.js').catch(function () {});
    }
  </script>
</body>
</html>
