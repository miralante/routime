<!DOCTYPE html>
<html lang="es" data-i18n-title="title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Compra | Routime</title>
  <meta name="theme-color" content="#FAF7F2">
  <link rel="stylesheet" href="../../assets/css/tokens.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="tool-header">
      <a href="../../site/index.html" class="back-link" data-i18n="core.back">← Volver</a>
      <h1 data-i18n="title">🛒 La Compra</h1>
      <span class="stars" id="stars">⭐ 0</span>
    </header>

    <!-- Screen: 2-activity menu -->
    <section id="pantallaMenu" class="pila">
      <div class="fila centrado-fila">
        <p class="instruccion" id="instruccion" data-i18n="instruccion">Aquí practicas dos cosas: en qué sección del súper está cada producto, y para qué comida del día lo necesitas.</p>
      </div>
      <div class="grid-tarjetas">
        <button type="button" class="tarjeta-actividad" id="tarjetaSecciones">
          <span class="picto" aria-hidden="true">🏪</span>
          <span class="nombre" data-i18n="menuSecciones">¿En qué sección?</span>
          <span class="detalle" data-i18n="menuSeccionesDetalle">Cada producto a su sección del súper.</span>
        </button>
        <button type="button" class="tarjeta-actividad" id="tarjetaLista">
          <span class="picto" aria-hidden="true">📝</span>
          <span class="nombre" data-i18n="menuLista">Mi lista de la compra</span>
          <span class="detalle" data-i18n="menuListaDetalle">Cada producto para su comida del día.</span>
        </button>
      </div>
    </section>

    <!-- ===== Activity 1: Which section? ===== -->

    <section id="pantallaNivelesSecciones" class="oculto pila centrado">
      <div class="fila"><button type="button" class="btn btn-secundario" id="btnVolverMenuSecciones" data-i18n="volverMenu">← Menú</button></div>
      <h2 data-i18n="elegirNivel">Elige el nivel</h2>
      <div class="pila" id="nivelesSecciones"></div>
    </section>

    <section id="pantallaJuegoSecciones" class="oculto pila">
      <div class="progress-bar">
        <div class="progress-fill" id="progressSeccionesFill"></div>
        <span class="progress-text" id="progressSeccionesText">0 / 10</span>
      </div>

      <div class="card centrado pila">
        <div class="item-picto" id="itemPictoSecciones"></div>
        <p class="item-palabra" id="itemPalabraSecciones"></p>
      </div>

      <div class="pila" id="cajasSecciones"></div>
      <div class="feedback" id="feedbackSecciones" aria-live="polite"></div>
      <div class="fila explicacion oculto" id="explicacionSeccionesWrap">
        <p id="explicacionSecciones" aria-live="polite"></p>
      </div>
      <button type="button" class="btn oculto" id="btnSiguienteSecciones" data-i18n="core.next" data-i18n-aria="core.nextAria">→</button>
    </section>

    <!-- ===== Actividad 2: mi lista de la compra ===== -->

    <section id="pantallaNivelesLista" class="oculto pila centrado">
      <div class="fila"><button type="button" class="btn btn-secundario" id="btnVolverMenuLista" data-i18n="volverMenu">← Menú</button></div>
      <h2 data-i18n="elegirNivel">Elige el nivel</h2>
      <div class="pila" id="nivelesLista"></div>
    </section>

    <section id="pantallaJuegoLista" class="oculto pila">
      <div class="progress-bar">
        <div class="progress-fill" id="progressListaFill"></div>
        <span class="progress-text" id="progressListaText">0 / 8</span>
      </div>

      <div class="card centrado pila">
        <div class="item-picto" id="itemPictoLista"></div>
        <p class="item-palabra" id="itemPalabraLista"></p>
      </div>

      <div class="feedback" id="feedbackLista" aria-live="polite"></div>
      <div class="fila explicacion oculto" id="explicacionListaWrap">
        <p id="explicacionLista" aria-live="polite"></p>
      </div>
      <button type="button" class="btn oculto" id="btnSiguienteLista" data-i18n="core.next" data-i18n-aria="core.nextAria">→</button>

      <div class="listas-dia" id="listasDia"></div>
    </section>

    <!-- Pantalla final (compartida por las 2 actividades) -->
    <section id="pantallaFinal" class="oculto centrado pila" aria-live="polite">
      <div class="emoji-grande" aria-hidden="true">🎉</div>
      <h2 data-i18n="core.roundComplete">¡Ronda completada!</h2>
      <p id="resumenFinal"></p>
      <p id="transferencia" class="transferencia" data-i18n="transferencia"></p>
      <button type="button" class="btn" id="btnRepetir" data-i18n="core.playAgain">Jugar otra vez</button>
      <button type="button" class="btn btn-secundario" id="btnOtroNivel" data-i18n="btnOtroNivel">Elegir otro nivel</button>
      <button type="button" class="btn btn-secundario" id="btnVolverMenuFinal" data-i18n="volverMenu">← Menú</button>
    </section>
    <footer class="pie-app">
      <a href="../../legal/index.html" class="enlace-legal" data-i18n="core.dataProtection">Protección de datos</a>
    </footer>
  </div>

  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script src="../../assets/js/tts.js"></script>
  <script src="../../assets/js/storage.js"></script>
  <script src="../../assets/js/feedback.js"></script>
  <script src="strings.es.js"></script>
  <script src="strings.en.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../../sw.js').catch(function () {});
    }
  </script>
</body>
</html>
