<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>De compras | Routime</title>
  <meta name="theme-color" content="#FAF7F2">
  <link rel="stylesheet" href="../../assets/css/tokens.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="tool-header">
      <a href="../../site/index.html" class="back-link">&larr; Volver</a>
      <h1>🛒 La Compra</h1>
      <span class="stars" id="stars">&starf; 0</span>
    </header>

    <!-- Pantalla inicial: elegir actividad -->
    <section id="startScreen" class="pila centered">
      <div class="row centered-row">
        <p class="instruccion" data-i18n="instruccion">Practica dos cosas del supermercado.</p>
      </div>
      <div class="fila" style="justify-content: center; gap: var(--espacio); flex-wrap: wrap;">
        <div class="tarjeta-actividad" id="tarjetaSecciones" role="button" tabindex="0">
          <span class="tarjeta-icono" aria-hidden="true">🏪</span>
          <strong data-i18n="menuSecciones">¿En qué sección?</strong>
          <span class="tarjeta-desc" data-i18n="menuSeccionesDetalle">Cada producto a su sección del súper.</span>
        </div>
        <div class="tarjeta-actividad" id="tarjetaLista" role="button" tabindex="0">
          <span class="tarjeta-icono" aria-hidden="true">📝</span>
          <strong data-i18n="menuLista">Mi lista de la compra</strong>
          <span class="tarjeta-desc" data-i18n="menuListaDetalle">Cada producto para su comida del día.</span>
        </div>
      </div>
    </section>

    <section id="gameScreen" class="hidden pila centered">

      <!-- Secciones mode -->
      <div class="secciones-screen" id="pantallaJuegoSecciones">
        <div class="progress-bar">
          <div class="progress-fill" id="progressSeccionesFill"></div>
          <span class="progress-text" id="progressSeccionesText"></span>
        </div>
        <div class="card centered stack">
          <span id="itemPictoSecciones" class="picto-grande"></span>
          <span id="itemPalabraSecciones" class="palabra-item"></span>
        </div>
        <div class="boxes-grid" id="cajasSecciones"></div>
        <div class="feedback" id="feedbackSecciones" aria-live="polite"></div>
        <div class="row explanation hidden" id="explanationSeccionesWrap">
          <p id="explanationSecciones"></p>
        </div>
        <button type="button" class="btn hidden" id="btnSiguienteSecciones">Siguiente</button>
      </div>

      <!-- Lista mode -->
      <div class="lista-screen" id="pantallaJuegoLista">
        <div class="progress-bar">
          <div class="progress-fill" id="progressListaFill"></div>
          <span class="progress-text" id="progressListaText"></span>
        </div>
        <div class="card centered stack">
          <span id="itemPictoLista" class="picto-grande"></span>
          <span id="itemPalabraLista" class="palabra-item"></span>
        </div>
        <div class="listas-dia" id="listasDia"></div>
        <div class="feedback" id="feedbackLista" aria-live="polite"></div>
        <div class="row explanation hidden" id="explanationListaWrap">
          <p id="explanationLista"></p>
        </div>
        <button type="button" class="btn hidden" id="btnSiguienteLista">Siguiente</button>
      </div>
    </section>

    <section id="endScreen" class="hidden centered pila" aria-live="polite">
      <div class="emoji-grande" aria-hidden="true">&#x1F38A;</div>
      <h2 data-i18n="core.roundComplete">Ronda completada!</h2>
      <p id="resumenFinal"></p>
      <p id="transferencia" class="transferencia" data-i18n="transferencia">Sigue praticando para aprender mas.</p>
      <button type="button" class="btn" id="btnRepeat" data-i18n="core.playAgain">Jugar otra vez</button>
      <button type="button" class="btn btn-secondary" id="btnMenu" data-i18n="volverMenu">← Menú</button>
      <a href="../../site/index.html" class="btn btn-secondary" data-i18n="core.backToMenu">Volver al menú</a>
    </section>
    <footer data-pie-app data-pie-base="../../" data-pie-class="pie-app"></footer>
  </div>

  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script src="../../assets/js/storage.js"></script>
  <script src="../../assets/js/feedback.js"></script>
  <script src="strings.es.js"></script>
  <script src="strings.en.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register("../../sw.js").catch(function () {});
    }
  </script>
</body>
</html>
