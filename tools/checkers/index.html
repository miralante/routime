<!DOCTYPE html>
<html lang="es" data-i18n-title="title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Las Damas | Routime</title>
  <meta name="theme-color" content="#FAF7F2">
  <link rel="stylesheet" href="../../assets/css/tokens.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="tool-header">
      <a href="../../site/index.html" class="back-link" data-i18n="core.back">← Volver</a>
      <h1 data-i18n="title">🔴 Las Damas</h1>
      <span class="stars" id="stars">⭐ 0</span>
    </header>

    <!-- Start screen -->
    <section id="pantallaInicio" class="pila centrado">
      <div class="fila centrado-fila">
        <p class="instruccion" id="instruccion" data-i18n="instruccion">Tú llevas las fichas rojas 🔴. Las fichas van en diagonal. Salta por encima de una ficha azul para comerla. Si llegas al final, tu ficha se convierte en dama 👑.</p>
      </div>
      <h2 data-i18n="elegirNivel">Elige el nivel</h2>
      <div class="pila" id="niveles"></div>
    </section>

    <!-- Game screen -->
    <section id="pantallaJuego" class="oculto pila centrado">
      <div class="fila centrado-fila">
        <p class="estado" id="estado" aria-live="polite"></p>
        <button type="button" class="btn btn-secundario" id="btnAyuda" data-i18n="btnAyuda">💡 Ayuda</button>
      </div>

      <div class="tablero" id="tablero" role="grid" data-i18n-aria="ariaTablero" aria-label="Tablero de damas"></div>

      <div class="fila explicacion oculto" id="ayudaWrap">
        <p id="ayudaTexto" aria-live="polite"></p>
        <button type="button" class="btn btn-audio" id="btnEscucharAyuda" data-i18n-aria="ariaEscucharAyuda" aria-label="Escuchar la ayuda">🔊</button>
      </div>

      <div class="feedback" id="feedback" aria-live="polite"></div>
      <p id="transferencia" class="transferencia" data-i18n="transferencia"></p>
      <div class="fila centrado-fila">
        <button type="button" class="btn oculto" id="btnOtraPartida" data-i18n="jugarOtraVez">Jugar otra vez</button>
        <button type="button" class="btn btn-secundario" id="btnSalir" data-i18n="btnOtroNivel">Elegir otro nivel</button>
      </div>
    </section>
    <footer class="pie-app">
      <a href="../../legal/index.html" class="enlace-legal" data-i18n="core.dataProtection">Protección de datos</a>
    </footer>
  </div>

  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script src="../../assets/js/tts.js"></script>
  <script src="../../assets/js/storage.js"></script>
  <script src="../../assets/js/feedback.js"></script>
  <script src="strings.es.js"></script>
  <script src="strings.en.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../../sw.js').catch(function () {});
    }
  </script>
</body>
</html>
