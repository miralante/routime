<!DOCTYPE html>
<html lang="es" data-i18n-title="title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diccionario | Routime</title>
  <meta name="theme-color" content="#FAF7F2">
  <link rel="stylesheet" href="../../assets/css/tokens.css?v=routime-v3bce">
  <link rel="stylesheet" href="../../assets/css/base.css?v=routime-v3bce">
  <link rel="stylesheet" href="../../assets/css/components.css?v=routime-v3bce">
  <link rel="stylesheet" href="styles.css?v=routime-v3bce">
</head>
<body>
  <div class="container">
    <header class="tool-header">
      <a href="../../site/index.html" class="back-link" data-i18n="core.back">← Volver</a>
      <h1 data-i18n="title">📚 Diccionario</h1>
      <span class="stars" id="stars">⭐ 0</span>
    </header>

    <!-- Pantalla inicial -->
    <section id="startScreen" class="pila centered">
      <div class="row center-row">
        <p class="instruction" id="instructionText" data-i18n="instruction">Aprende words difíciles con su significado sencillo y un ejemplo. Después, haz un test para comprobar qué recuerdas.</p>
      </div>
      <span class="dificultad" id="dificultad" aria-live="polite"></span>
      <button type="button" class="btn btn-principal" id="btnPlay">
        <span data-i18n="btnJugar">¡Jugar!</span>
      </button>
    </section>

    <!-- Pantalla 1: fichas de la palabra -->
    <section id="cardsScreen" class="hidden pila centered">
      <div class="progress-bar">
        <div class="progress-fill" id="cardsProgressFill"></div>
        <span class="progress-text" id="cardsProgressText">1 / 8</span>
      </div>
      <div class="card centered pila">
        <div class="word-display" id="wordDisplay"></div>
        <p class="definition-text"><span data-i18n="definitionLabel">Significa:</span> <span id="definitionText"></span></p>
        <p class="example-text"><span data-i18n="exampleLabel">Por ejemplo:</span> <span id="exampleText"></span></p>      </div>
      <button type="button" class="btn" id="nextCardBtn" data-i18n="core.next" data-i18n-aria="core.nextAria">→</button>
    </section>

    <!-- Pantalla 2: test -->
    <section id="quizScreen" class="hidden pila">
      <div class="progress-bar">
        <div class="progress-fill" id="quizProgressFill"></div>
        <span class="progress-text" id="quizProgressText">0 / 8</span>
      </div>
      <div class="card centered pila">
        <div class="word-display" id="quizWordDisplay"></div>      </div>
      <h2 class="question centered" data-i18n="quizQuestion">¿Qué significa esta palabra?</h2>
      <div class="pila" id="quizOptions"></div>
      <div class="feedback" id="quizFeedback" aria-live="polite"></div>
      <div class="row explicacion hidden" id="quizExplanationWrap">
        <p id="quizExplanation" aria-live="polite"></p>      </div>
      <button type="button" class="btn hidden" id="quizNextBtn" data-i18n="core.next" data-i18n-aria="core.nextAria">→</button>
    </section>

    <!-- End screen -->
    <section id="endScreen" class="hidden centered pila" aria-live="polite">
      <div class="big-emoji" aria-hidden="true">🎉</div>
      <h2 data-i18n="core.roundComplete">¡Ronda completada!</h2>
      <p id="finalSummary"></p>
      <p id="resumenFinal"></p>
      <p id="transferencia" class="transferencia" data-i18n="transferencia"></p>
      <button type="button" class="btn" id="btnRepeat" data-i18n="core.playAgain">Jugar otra vez</button>
      <a href="../../site/index.html" class="btn btn-secondary" data-i18n="core.backToMenu">Volver al menú</a>
    </section>
    <footer data-pie-app data-pie-base="../../" data-pie-class="pie-app"></footer>
  </div>

  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script src="../../assets/js/storage.js"></script>
  <script src="../../assets/js/feedback.js"></script>
  <script src="strings.es.js"></script>
  <script src="strings.en.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../../sw.js').catch(function () {});
    }
  </script>
</body>
</html>
