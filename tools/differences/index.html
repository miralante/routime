    <div data-suite-header data-suite-logo="../../assets/img/icono.svg?v=routime-va8882152" data-suite-byline></div>

      <h1 data-i18n="title">🔍 Diferencias</h1>
    </div>
    <main class="suite-body">
    <span class="stars" data-suite-stars id="stars">⭐ 0</span>

    <!-- Start screen -->
    <section id="startScreen" class="hidden pila centered">
      <div class="row centered-row">
        <p class="instruccion" id="instruccion" data-i18n="instruccion">Mira los dos dibujos. Toca en el de la derecha lo que es distinto.</p>
      </div>
      <button type="button" class="btn" id="btnEmpezar" data-i18n="empezar">Empezar</button>
    </section>

    <!-- Game screen -->
    <section id="gameScreen" class="hidden pila">
      <p class="escena-titulo centered" id="escenaTitulo"></p>
      <div class="progress-bar" data-suite-progress>
        <div class="progress-fill" id="progressFill"></div>
        <span class="progress-text" id="progressText"></span>
      </div>

      <div class="escenas">
        <div class="panel-escena">
          <p class="panel-etiqueta" data-i18n="etiquetaIgual">Igual</p>
          <div class="rejilla" id="rejillaIzquierda" data-i18n-aria="ariaOriginal" aria-label="Dibujo original"></div>
        </div>
        <div class="panel-escena">
          <p class="panel-etiqueta" data-i18n="etiquetaBusca">Busca lo distinto</p>
          <div class="rejilla" id="rejillaDerecha" data-i18n-aria="ariaDistinto" aria-label="Toca lo que es distinto"></div>
        </div>
      </div>

      <p class="contador centered" id="contador" aria-live="polite"></p>
      <div class="feedback" id="feedback" aria-live="polite"></div>
      <button type="button" class="btn hidden" id="btnNext" data-i18n="siguienteEscena" data-i18n-aria="siguienteEscenaAria">→</button>
    </section>

    <!-- End screen -->
    <section id="endScreen" class="hidden centered pila" aria-live="polite">
      <div class="emoji-grande" aria-hidden="true">🎉</div>
      <h2 data-i18n="rondaCompletadaTitulo">¡Ronda completada!</h2>
      <p id="resumenFinal"></p>
      <p id="transferencia" class="transferencia" data-i18n="transferencia"></p>
      <button type="button" class="btn" id="btnRepeat" data-i18n="core.playAgain">Jugar otra vez</button>
    </section>
    </main>
    <footer data-suite-footer data-suite-base="../../" data-suite-settings></footer>
