<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda | Routime</title>
  <meta name="theme-color" content="#FAF7F2">
  <link rel="stylesheet" href="../../assets/css/tokens.css?v=routime-v0621c865">
  <link rel="stylesheet" href="../../assets/css/base.css?v=routime-v3615648a">
  <link rel="stylesheet" href="../../assets/css/components.css?v=routime-v962b12ea">
  <link rel="stylesheet" href="styles.css?v=routime-v057c2785">
</head>
<body>
  <div class="container">
    <header class="tool-header">
      <a href="../../" class="back-link">&larr; Volver</a>
      <h1>Routime</h1>
      <span class="stars" id="stars">&starf; 0</span>
    </header>

    <!-- Menu: one card per activity (app.js opens the levels of the card's activity) -->
    <section id="menuScreen" class="pila centered">
      <div class="row centered-row">
        <p class="instruccion" data-i18n="instruccion">Pulsa Jugar para empezar.</p>
      </div>
      <div class="stack centered">
        <button type="button" class="tarjeta-actividad" data-actividad="tienda">
          <span class="picto" aria-hidden="true">🛒</span>
          <span class="name" data-i18n="menuTienda">Una compra</span>
          <span class="detalle" data-i18n="menuTiendaDetalle">De principio a fin: mira, paga y revisa.</span>
        </button>
        <button type="button" class="tarjeta-actividad" data-actividad="quedame">
          <span class="picto" aria-hidden="true">🧾</span>
          <span class="name" data-i18n="menuQuedame">¿Qué me queda?</span>
          <span class="detalle" data-i18n="menuQuedameDetalle">Vas comprando. Calcula lo que te queda.</span>
        </button>
        <button type="button" class="tarjeta-actividad" data-actividad="mucho">
          <span class="picto" aria-hidden="true">⚖️</span>
          <span class="name" data-i18n="menuMucho">¿Mucho o poco?</span>
          <span class="detalle" data-i18n="menuMuchoDetalle">¿Es un precio normal para lo que es?</span>
        </button>
        <button type="button" class="tarjeta-actividad" data-actividad="paga">
          <span class="picto" aria-hidden="true">📅</span>
          <span class="name" data-i18n="menuPaga">Mi paga semanal</span>
          <span class="detalle" data-i18n="menuPagaDetalle">Reparte tu paga de la semana.</span>
        </button>
        <button type="button" class="tarjeta-actividad" data-actividad="fiar">
          <span class="picto" aria-hidden="true">🕵️</span>
          <span class="name" data-i18n="menuFiar">¿Es de fiar?</span>
          <span class="detalle" data-i18n="menuFiarDetalle">Gangas que parecen demasiado buenas.</span>
        </button>
      </div>
    </section>

    <!-- Levels of the activity chosen in the menu -->
    <section id="pantallaNiveles" class="hidden pila centered">
      <p id="instruccionActividad" class="instruccion"></p>
      <h2 data-i18n="elegirNivel">Elige el nivel</h2>
      <div id="niveles" class="stack centered"></div>
      <button type="button" class="btn btn-secondary" id="btnVolverMenuNiveles" data-i18n="volverMenu">← Menú</button>
    </section>

    <!-- Quiz activities: what is left, how much, the allowance, is it trustworthy -->
    <section id="pantallaJuegoQuiz" class="hidden pila centered">
      <div class="progress-bar">
        <div class="progress-fill" id="progressQuizFill"></div>
        <span class="progress-text" id="progressQuizText"></span>
      </div>
      <div class="card centered stack">
        <p id="enunciadoQuiz" class="prompt"></p>
      </div>
      <div class="mesa-dinero" id="mesaDinero"></div>
      <div class="options stack" id="optionsQuiz"></div>
      <div class="feedback" id="feedbackQuiz" aria-live="polite"></div>
      <div class="row explanation hidden" id="explanationQuizWrap">
        <p id="explanationQuiz" aria-live="polite"></p>
      </div>
      <button type="button" class="btn hidden" id="btnNextQuiz">Siguiente &#8594;</button>
    </section>

    <!-- The purchase: 3 steps (does it fit? pay? is the change right?) -->
    <section id="pantallaJuegoTienda" class="hidden pila centered">
      <div class="progress-bar">
        <div class="progress-fill" id="progressTiendaFill"></div>
        <span class="progress-text" id="progressTiendaText"></span>
      </div>
      <div class="card centered stack" id="cartelProducto">
        <span class="producto" id="productoTienda"></span>
        <span class="precio" id="precioTienda"></span>
      </div>
      <p id="enunciadoTienda" class="prompt"></p>
      <div class="mesa-dinero" id="mesaTienda"></div>
      <div class="zona-pago" id="zonaPago">
        <div class="mesa-dinero mostrador" id="mostrador"></div>
        <p class="total" id="totalMostrador"></p>
      </div>
      <div class="acciones-tienda stack" id="accionesTienda"></div>
      <div class="feedback" id="feedbackTienda" aria-live="polite"></div>
      <div class="row explanation hidden" id="explanationTiendaWrap">
        <p id="explanationTienda" aria-live="polite"></p>
      </div>
      <button type="button" class="btn hidden" id="btnContinuarTienda" data-i18n="btnContinuar">Continuar</button>
    </section>

    <section id="endScreen" class="hidden centered pila" aria-live="polite">
      <div class="emoji-grande" aria-hidden="true">&#x1F38A;</div>
      <h2>Ronda completada!</h2>
      <p id="endSummary"></p>
      <button type="button" class="btn" id="repeatBtn">Jugar otra vez</button>
      <button type="button" class="btn btn-secondary" id="btnOtroNivelFinal" data-i18n="btnOtroNivel">Elegir otro nivel</button>
      <button type="button" class="btn btn-secondary" id="btnVolverMenuFinal" data-i18n="volverMenu">← Menú</button>
      <a href="../../" class="btn btn-secondary">Volver al menu</a>
    </section>
    <footer data-pie-app data-pie-base="../../" data-pie-class="pie-app"></footer>
  </div>

  <script src="../../assets/js/utils.js?v=routime-ve76918bf"></script>
  <script src="../../assets/js/i18n.js?v=routime-va36e1615"></script>
  <script src="../../assets/js/storage.js?v=routime-v75a532c9"></script>
  <script src="../../assets/js/feedback.js?v=routime-vabee13e2"></script>
  <script src="../../assets/js/dinero.js?v=routime-v57c1471c"></script>
  <script src="strings.es.js?v=routime-v4e281f39"></script>
  <script src="strings.en.js?v=routime-vc4333573"></script>
  <script src="data.js?v=routime-va59fd4e3"></script>
  <script src="../../assets/js/activity-glue.js?v=routime-v05f27e1d"></script>
  <script src="app.js?v=routime-v5acaa535"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register("../../sw.js").catch(function () {});
    }
  </script>
<script src="../../assets/js/sw-update.js?v=routime-v3f9b562c" defer></script>
</body>
</html>
