<!DOCTYPE html>
<html lang="es" data-i18n-title="title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colorear | Routime</title>
  <meta name="theme-color" content="#FAF7F2">
    <link rel="stylesheet" href="../../assets/css/brand.css">
  <link rel="stylesheet" href="../../assets/css/tokens.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/locale-picker.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div data-suite-header data-suite-logo="../../assets/img/icono.svg" data-suite-byline></div>
    <div class="suite-chrome-activity" data-suite-activity>
      <a href="../../" class="back-link" data-i18n="core.back">← Volver</a>
      <h1 data-i18n="title">🎨 Colorear</h1>
    </div>
    <main class="suite-body">
    <span class="stars" data-suite-stars id="stars">⭐ 0</span>

    <!-- Start screen -->
    <section id="startScreen" class="pila centered">
      <div class="row centered-row">
        <p class="instruccion" id="instruccion" data-i18n="instruccion">Elige un dibujo. Después, elige un color y toca una zona para pintarla.</p>
      </div>
      <h2 data-i18n="tituloElegirDibujo">Elige un dibujo</h2>
      <div class="cards-grid" id="drawings"></div>
    </section>

    <!-- Game screen -->
    <section id="gameScreen" class="hidden pila">
      <p class="dibujo-titulo centered" id="drawingTitle"></p>

      <div id="canvasContainer">
        <svg id="canvas" viewBox="0 0 100 100" data-i18n-aria="lienzoAria" aria-label="Dibujo para colorear"></svg>
      </div>

      <div class="pila-colores" id="colors"></div>

      <div class="row centered-row acciones">
        <button type="button" class="btn" id="btnDone" data-i18n="btnTerminado">✔ He terminado</button>
      </div>

      <div class="feedback" id="feedback" aria-live="polite"></div>
    </section>

    <!-- End screen -->
    <section id="endScreen" class="hidden centered pila" aria-live="polite">
      <div class="emoji-grande" aria-hidden="true">🎉</div>
      <h2 data-i18n="finalTitulo">¡Qué bonito!</h2>
      <p id="summary"></p>
      <p id="transferencia" class="transferencia" data-i18n="transferencia"></p>
      <button type="button" class="btn" id="btnAnotherDrawing" data-i18n="otroDibujo">Pintar otro dibujo</button>
    </section>
    </main>
    <footer data-suite-footer data-suite-base="../../" data-suite-settings></footer>
  </div>

  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script src="../../assets/js/storage.js"></script>
  <script src="../../assets/js/feedback.js"></script>
  <script src="strings.es.js"></script>
  <script src="strings.en.js"></script>
  <script src="data.js"></script>
  <script src="../../assets/js/stars-engine.js"></script>
  <script src="../../assets/js/stars-strings.js"></script>
  <script src="../../assets/js/activity-glue.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../../sw.js').catch(function () {});
    }
  </script>
<script src="../../assets/js/sw-update.js" defer></script>
  <script src="../../assets/js/locale-picker-config.js"></script>
  <script src="../../assets/js/locale-picker.js" defer></script>
  <script src="../../assets/js/suite-chrome.js"></script>
</body>
</html>
