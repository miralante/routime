<!DOCTYPE html>
<html lang="es" data-i18n-title="title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colorear | Routime</title>
  <meta name="theme-color" content="#FAF7F2">
  <link rel="stylesheet" href="../../assets/css/tokens.css?v=routime-v32fbcfdc">
  <link rel="stylesheet" href="../../assets/css/base.css?v=routime-v24767fa6">
  <link rel="stylesheet" href="../../assets/css/components.css?v=routime-v962b12ea">
  <link rel="stylesheet" href="styles.css?v=routime-v7014b8e5">
</head>
<body>
  <div class="container">
    <header class="tool-header">
      <a href="../../" class="back-link" data-i18n="core.back">← Volver</a>
      <h1 data-i18n="title">🎨 Colorear</h1>
      <span class="stars" id="stars">⭐ 0</span>
    </header>

    <!-- Start screen -->
    <section id="startScreen" class="pila centered">
      <div class="row centered-row">
        <p class="instruccion" id="instruccion" data-i18n="instruccion">Elige un dibujo. Después, elige un color y toca una zona para pintarla.</p>
      </div>
      <h2 data-i18n="tituloElegirDibujo">Elige un dibujo</h2>
      <div class="cards-grid" id="drawings"></div>
    </section>

    <!-- Game screen -->
    <section id="gameScreen" class="hidden pila">
      <p class="dibujo-titulo centered" id="drawingTitle"></p>

      <div id="canvasContainer">
        <svg id="canvas" viewBox="0 0 100 100" data-i18n-aria="lienzoAria" aria-label="Dibujo para colorear"></svg>
      </div>

      <div class="pila-colores" id="colors"></div>

      <div class="row centered-row acciones">
        <button type="button" class="btn" id="btnDone" data-i18n="btnTerminado">✔ He terminado</button>
      </div>

      <div class="feedback" id="feedback" aria-live="polite"></div>
    </section>

    <!-- End screen -->
    <section id="endScreen" class="hidden centered pila" aria-live="polite">
      <div class="emoji-grande" aria-hidden="true">🎉</div>
      <h2 data-i18n="finalTitulo">¡Qué bonito!</h2>
      <p id="summary"></p>
      <p id="transferencia" class="transferencia" data-i18n="transferencia"></p>
      <button type="button" class="btn" id="btnAnotherDrawing" data-i18n="otroDibujo">Pintar otro dibujo</button>
      <a href="../../" class="btn btn-secondary" data-i18n="core.backToMenu">Volver al menú</a>
    </section>
    <footer data-pie-app data-pie-base="../../" data-pie-class="pie-app"></footer>
  </div>

  <script src="../../assets/js/utils.js?v=routime-v32a47fbd"></script>
  <script src="../../assets/js/i18n.js?v=routime-v729f90fb"></script>
  <script src="../../assets/js/storage.js?v=routime-veaa669aa"></script>
  <script src="../../assets/js/feedback.js?v=routime-v93b35d8d"></script>
  <script src="strings.es.js?v=routime-vedd55a86"></script>
  <script src="strings.en.js?v=routime-v7b2396c2"></script>
  <script src="data.js?v=routime-va29a9d9c"></script>
  <script src="app.js?v=routime-v633c719c"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../../sw.js').catch(function () {});
    }
  </script>
<script src="../../assets/js/sw-update.js?v=routime-v6d6b3d4b" defer></script>
</body>
</html>
