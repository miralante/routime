<!DOCTYPE html>
<html lang="es" data-i18n-title="title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colorear | Routime</title>
  <meta name="theme-color" content="#FAF7F2">
  <link rel="stylesheet" href="../../assets/css/tokens.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="tool-header">
      <a href="../../site/index.html" class="back-link" data-i18n="core.back">← Volver</a>
      <h1 data-i18n="title">🎨 Colorear</h1>
      <span class="stars" id="stars">⭐ 0</span>
    </header>

    <!-- Start screen -->
    <section id="pantallaInicio" class="pila centrado">
      <div class="fila centrado-fila">
        <p class="instruccion" id="instruccion" data-i18n="instruccion">Elige un dibujo. Después, elige un color y toca una zona para pintarla.</p>
      </div>
      <h2 data-i18n="tituloElegirDibujo">Elige un dibujo</h2>
      <div class="grid-tarjetas" id="dibujos"></div>
    </section>

    <!-- Game screen -->
    <section id="pantallaJuego" class="oculto pila">
      <p class="dibujo-titulo centrado" id="dibujoTitulo"></p>

      <div id="lienzoContenedor">
        <svg id="lienzo" viewBox="0 0 100 100" data-i18n-aria="lienzoAria" aria-label="Dibujo para colorear"></svg>
      </div>

      <div class="pila-colores" id="colores"></div>

      <div class="fila centrado-fila acciones">
        <button type="button" class="btn" id="btnTerminado" data-i18n="btnTerminado">✔ He terminado</button>
      </div>

      <div class="feedback" id="feedback" aria-live="polite"></div>
    </section>

    <!-- End screen -->
    <section id="pantallaFinal" class="oculto centrado pila" aria-live="polite">
      <div class="emoji-grande" aria-hidden="true">🎉</div>
      <h2 data-i18n="finalTitulo">¡Qué bonito!</h2>
      <p id="resumenFinal"></p>
      <p id="transfer" class="transferencia" data-i18n="transfer"></p>
      <button type="button" class="btn" id="btnOtroDibujo" data-i18n="otroDibujo">Pintar otro dibujo</button>
      <a href="../../site/index.html" class="btn btn-secundario" data-i18n="core.backToMenu">Volver al menú</a>
    </section>
    <footer data-pie-app data-pie-base="../../" data-pie-class="pie-app"></footer>
  </div>

  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script src="../../assets/js/tts.js"></script>
  <script src="../../assets/js/storage.js"></script>
  <script src="../../assets/js/feedback.js"></script>
  <script src="strings.es.js"></script>
  <script src="strings.en.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../../sw.js').catch(function () {});
    }
  </script>
</body>
</html>
