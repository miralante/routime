<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Botiquin | Routime</title>
  <meta name="theme-color" content="#FAF7F2">
  <link rel="stylesheet" href="../../assets/css/tokens.css?v=routime-v3bce">
  <link rel="stylesheet" href="../../assets/css/base.css?v=routime-v3bce">
  <link rel="stylesheet" href="../../assets/css/components.css?v=routime-v3bce">
  <link rel="stylesheet" href="styles.css?v=routime-v3bce">
</head>
<body>
  <div class="container">
    <header class="tool-header">
      <a href="../../site/index.html" class="back-link">&larr; Volver</a>
      <h1>Routime</h1>
      <span class="stars" id="stars">&starf; 0</span>
    </header>

    <section id="startScreen" class="hidden pila centered">
      <div class="row centered-row">
        <p class="instruccion" data-i18n="instruccion">Pulsa Jugar para empezar.</p>
      </div>
      <button type="button" class="btn btn-principal" id="btnPlay">
        <span data-i18n="btnJugar">Jugar!</span>
      </button>
    </section>

    <section id="gameScreen" class="hidden pila centered">

      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
        <span class="progress-text" id="progressText"></span>
        <span class="dificultad" id="level"></span>
      </div>
      <div class="card centered stack">
        <span id="situacionPicto" class="picto-situacion"></span>
        <p id="situacionTexto" class="situacion-text"></p>
        <button type="button" class="btn btn-audio" id="listenBtn">&#128266;</button>
      </div>
      <div class="options stack" id="options"></div>
      <div class="feedback" id="feedback" aria-live="polite"></div>
      <div class="row explanation hidden" id="explanationWrap">
        <p id="explanation" aria-live="polite"></p>
      </div>
      <button type="button" class="btn hidden" id="btnNext">Siguiente &#8594;</button>
    </section>

    <section id="endScreen" class="hidden centered pila" aria-live="polite">
      <div class="emoji-grande" aria-hidden="true">&#x1F38A;</div>
      <h2>Ronda completada!</h2>
      <p id="endSummary"></p>
      <p class="transferencia">Sigue praticando para aprender mas.</p>
      <button type="button" class="btn" id="repeatBtn">Jugar otra vez</button>
      <button type="button" class="btn btn-secondary" id="btnMenu">Volver al inicio</button>
      <a href="../../site/index.html" class="btn btn-secondary">Volver al menu</a>
    </section>
    <footer data-pie-app data-pie-base="../../" data-pie-class="pie-app"></footer>
  </div>

  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script src="../../assets/js/storage.js"></script>
  <script src="../../assets/js/feedback.js"></script>
  <script src="strings.es.js"></script>
  <script src="strings.en.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register("../../sw.js").catch(function () {});
    }
  </script>
</body>
</html>
