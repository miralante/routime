<!DOCTYPE html>
<html lang="es" data-i18n-title="title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ortografía en Colores | Routime</title>
  <meta name="theme-color" content="#FAF7F2">
  <link rel="stylesheet" href="../../assets/css/tokens.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="tool-header">
      <a href="../../site/index.html" class="back-link" data-i18n="core.back">← Volver</a>
      <h1 data-i18n="title">🖍️ Ortografía en Colores</h1>
      <span class="stars" id="stars">⭐ 0</span>
    </header>

    <!-- Pantalla inicial: elegir nivel -->
    <section id="startScreen" class="pila centrado">
      <div class="fila center-row">
        <p class="instruction" id="instructionText" data-i18n="instruction">Escribe la oración como la ves. Cada letra cambia de color para ayudarte.</p>
        <button type="button" class="btn btn-audio" id="instructionBtn" data-i18n-aria="core.listenInstructions" aria-label="Escuchar las instrucciones">🔊</button>
      </div>
      <h2 data-i18n="chooseLevel">Elige un nivel</h2>
      <div class="pila" id="levels"></div>
    </section>

    <!-- Pantalla de escritura -->
    <section id="quizScreen" class="oculto pila">
      <div class="fila">
        <button type="button" class="btn btn-secundario" id="backLevelsBtn" data-i18n="core.back">← Volver</button>
      </div>

      <div class="card centrado pila">
        <div class="word-picto" id="sentencePicto" aria-hidden="true"></div>
        <div class="hint-line" id="hintLine" aria-hidden="true"></div>
        <button type="button" class="btn btn-audio" id="listenBtn" data-i18n-aria="core.listenText" aria-label="Escuchar la oración">🔊</button>
      </div>

      <label class="oculto" for="sentenceInput" data-i18n="inputAriaLabel">Escribe aquí la oración</label>
      <input
        id="sentenceInput"
        class="text-input"
        type="text"
        autocomplete="off"
        autocapitalize="characters"
        spellcheck="false"
        data-i18n-aria="inputAriaLabel"
        aria-label="Escribe aquí la oración"
      />

      <div class="feedback" id="feedback" aria-live="polite"></div>
      <div class="fila explicacion oculto" id="legendWrap">
        <p id="legendText"></p>
      </div>

      <div class="fila action-row">
        <button type="button" class="btn btn-secundario" id="clearBtn" data-i18n="clear">Borrar</button>
        <button type="button" class="btn" id="checkBtn" data-i18n="check">Comprobar</button>
      </div>

      <button type="button" class="btn oculto" id="nextBtn" data-i18n="core.next" data-i18n-aria="core.nextAria">→</button>
    </section>

    <!-- Pantalla final -->
    <section id="endScreen" class="oculto centrado pila" aria-live="polite">
      <div class="big-emoji" aria-hidden="true">🎉</div>
      <h2 data-i18n="core.roundComplete">¡Ronda completada!</h2>
      <p id="finalSummary"></p>
      <p id="transferencia" class="transferencia" data-i18n="transferencia"></p>
      <button type="button" class="btn" id="replayBtn" data-i18n="core.playAgain">Jugar otra vez</button>
      <button type="button" class="btn btn-secundario" id="otherLevelBtn" data-i18n="chooseAnotherLevel">Elegir otro nivel</button>
      <a href="../../site/index.html" class="btn btn-secundario" data-i18n="core.backToMenu">Volver al menú</a>
    </section>
    <footer class="pie-app">
      <a href="../../legal/index.html" class="enlace-legal" data-i18n="core.dataProtection">Protección de datos</a>
    </footer>
  </div>

  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script src="../../assets/js/tts.js"></script>
  <script src="../../assets/js/storage.js"></script>
  <script src="../../assets/js/feedback.js"></script>
  <script src="strings.es.js"></script>
  <script src="strings.en.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../../sw.js').catch(function () {});
    }
  </script>
</body>
</html>
