<!DOCTYPE html>
<html lang="es" data-i18n-title="title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ortografía en Colores | Routime</title>
  <meta name="theme-color" content="#FAF7F2">
  <link rel="stylesheet" href="../../assets/css/tokens.css?v=routime-v3bce">
  <link rel="stylesheet" href="../../assets/css/base.css?v=routime-v3bce">
  <link rel="stylesheet" href="../../assets/css/components.css?v=routime-v3bce">
  <link rel="stylesheet" href="styles.css?v=routime-v3bce">
</head>
<body>
  <div class="container">
    <header class="tool-header">
      <a href="../../site/index.html" class="back-link" data-i18n="core.back">← Volver</a>
      <h1 data-i18n="title">🖍️ Ortografía en Colores</h1>
      <span class="stars" id="stars">⭐ 0</span>
    </header>

    <!-- Pantalla inicial -->
    <section id="startScreen" class="pila centered">
      <div class="row center-row">
        <p class="instruction" id="instructionText" data-i18n="instruction">Escribe la oración como la ves. Cada letra cambia de color para ayudarte.</p>
      </div>
      <span class="dificultad" id="dificultad" aria-live="polite"></span>
      <button type="button" class="btn btn-principal" id="btnPlay">
        <span data-i18n="btnJugar">¡Jugar!</span>
      </button>
    </section>

    <!-- Pantalla de escritura -->
    <section id="quizScreen" class="hidden pila">
      <div class="card centered pila">
        <div class="word-picto" id="sentencePicto" aria-hidden="true"></div>
        <div class="hint-line" id="hintLine" aria-hidden="true"></div>
      </div>

      <label class="hidden" for="sentenceInput" data-i18n="inputAriaLabel">Escribe aquí la oración</label>
      <input
        id="sentenceInput"
        class="text-input"
        type="text"
        autocomplete="off"
        autocapitalize="characters"
        spellcheck="false"
        data-i18n-aria="inputAriaLabel"
        aria-label="Escribe aquí la oración"
      />

      <div class="feedback" id="feedback" aria-live="polite"></div>
      <div class="row explicacion hidden" id="legendWrap">
        <p id="legendText"></p>
      </div>

      <div class="row action-row">
        <button type="button" class="btn btn-secondary" id="clearBtn" data-i18n="clear">Borrar</button>
        <button type="button" class="btn" id="checkBtn" data-i18n="check">Comprobar</button>
      </div>

      <button type="button" class="btn hidden" id="nextBtn" data-i18n="core.next" data-i18n-aria="core.nextAria">→</button>
    </section>

    <!-- Pantalla final -->
    <section id="endScreen" class="hidden centered pila" aria-live="polite">
      <div class="big-emoji" aria-hidden="true">🎉</div>
      <h2 data-i18n="core.roundComplete">¡Ronda completada!</h2>
      <p id="finalSummary"></p>
      <p id="resumenFinal"></p>
      <p id="transferencia" class="transferencia" data-i18n="transferencia"></p>
      <button type="button" class="btn" id="btnRepeat" data-i18n="core.playAgain">Jugar otra vez</button>
      <a href="../../site/index.html" class="btn btn-secondary" data-i18n="core.backToMenu">Volver al menú</a>
    </section>
    <footer data-pie-app data-pie-base="../../" data-pie-class="pie-app"></footer>
  </div>

  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script src="../../assets/js/storage.js"></script>
  <script src="../../assets/js/feedback.js"></script>
  <script src="strings.es.js"></script>
  <script src="strings.en.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../../sw.js').catch(function () {});
    }
  </script>
</body>
</html>
