<!DOCTYPE html>
<html lang="es" data-i18n-title="title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redes, intimidad y ley | Routime</title>
  <meta name="theme-color" content="#FAF7F2">
  <link rel="stylesheet" href="../../assets/css/tokens.css?v=routime-v3bce">
  <link rel="stylesheet" href="../../assets/css/base.css?v=routime-v3bce">
  <link rel="stylesheet" href="../../assets/css/components.css?v=routime-v3bce">
  <link rel="stylesheet" href="styles.css?v=routime-v3bce">
</head>
<body>
  <div class="container">
    <header class="tool-header">
      <a href="../../site/index.html" class="back-link" data-i18n="core.back">← Volver</a>
      <h1 data-i18n="title">🧩 Redes, intimidad y ley</h1>
      <span class="stars" id="stars">⭐ 0</span>
    </header>

    <section id="startScreen" class="pila centered">
      <div class="row centered-row">
        <p class="instruccion" id="instruction" data-i18n="instruction">Practica cómo protegerte ante situaciones difíciles en redes sociales.</p>
      </div>
      <div class="safety-note" role="note">
        <span aria-hidden="true">🛟</span>
        <p data-i18n="safetyNote">Si algo parecido te ha ocurrido, no es tu culpa. Para, guarda las pruebas y pide ayuda a una persona de confianza.</p>
      </div>
      <span class="dificultad" id="dificultad" aria-live="polite"></span>
      <button type="button" class="btn btn-principal" id="btnPlay">
        <span data-i18n="btnJugar">¡Jugar!</span>
      </button>
    </section>

    <section id="caseScreen" class="hidden pila">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div><span class="progress-text" id="progressText">1 / 5</span></div>
      <div class="card centered pila">
        <div class="case-icon" id="caseIcon" aria-hidden="true"></div>
        <p class="text-principal" id="caseText"></p>
      </div>
      <h2 class="pregunta centered" data-i18n="question">¿Qué haces?</h2>
      <div class="pila" id="options"></div>
      <div class="feedback" id="feedback" aria-live="polite"></div>
      <div class="row explicacion hidden" id="explanationWrap">
        <p id="explanation" aria-live="polite"></p>
      </div>
      <button type="button" class="btn hidden" id="nextButton" data-i18n="core.next" data-i18n-aria="core.nextAria">→</button>
    </section>

    <section id="endScreen" class="hidden centered pila" aria-live="polite">
      <div class="emoji-grande" aria-hidden="true">🛡️</div>
      <p id="transferencia" class="transferencia" data-i18n="transferencia"></p>
      <h2 data-i18n="roundComplete">Tema completado</h2>
      <p id="endText"></p>
      <p id="resumenFinal"></p>
      <button type="button" class="btn" id="btnRepeat" data-i18n="repeat">Practicar otra vez</button>
      <a href="../../site/index.html" class="btn btn-secondary" data-i18n="core.backToMenu">Volver al menú</a>
    </section>
    <footer data-pie-app data-pie-base="../../" data-pie-class="pie-app"></footer>
  </div>

  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script src="../../assets/js/storage.js"></script>
  <script src="../../assets/js/feedback.js"></script>
  <script src="strings.es.js"></script>
  <script src="strings.en.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('../../sw.js').catch(function () {});</script>
</body>
</html>
