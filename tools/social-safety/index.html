<!DOCTYPE html>
<html lang="es" data-i18n-title="title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redes, intimidad y ley | Routime</title>
  <meta name="theme-color" content="#FAF7F2">
    <link rel="stylesheet" href="../../assets/css/brand.css">
  <link rel="stylesheet" href="../../assets/css/tokens.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/locale-picker.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div data-suite-header data-suite-logo="../../assets/img/icono.svg" data-suite-byline></div>
    <div class="suite-chrome-activity" data-suite-activity>
      <a href="../../" class="back-link" data-i18n="core.back">← Volver</a>
      <h1 data-i18n="title">🧩 Redes, intimidad y ley</h1>
    </div>
    <main class="suite-body">
    <span class="stars" data-suite-stars id="stars">⭐ 0</span>

    <!-- Menu: one subactivity per topic, so each run stays short -->
    <section id="menuScreen" class="pila">
      <p class="instruccion centered" data-i18n="instruction">Practica cómo protegerte ante situaciones difíciles en redes sociales.</p>
      <div class="pila" id="listaTemas"></div>
    </section>

    <section id="caseScreen" class="hidden pila">
      <div class="progress-bar" data-suite-progress><div class="progress-fill" id="progressFill"></div><span class="progress-text" id="progressText">1 / 5</span></div>
      <span class="dificultad" id="grupoCaso" aria-live="polite"></span>
      <div class="card centered pila">
        <div class="case-icon" id="caseIcon" aria-hidden="true"></div>
        <p class="text-principal" id="caseText"></p>
      </div>
      <h2 class="pregunta centered" data-i18n="question">¿Qué haces?</h2>
      <div class="pila" id="options"></div>
      <div class="feedback" id="feedback" aria-live="polite"></div>
      <div class="row explicacion hidden" id="explanationWrap">
        <p id="explanation" aria-live="polite"></p>
      </div>
      <button type="button" class="btn hidden" id="nextButton" data-i18n="core.next" data-i18n-aria="core.nextAria">→</button>
      <button type="button" class="btn btn-secondary" id="btnVerTodas" data-i18n="verTodas">Ver todos los casos</button>
      <button type="button" class="btn btn-secondary" id="btnOtroTemaCaso" data-i18n="anotherTopic">Elegir otro tema</button>
    </section>

    <section id="endScreen" class="hidden centered pila" aria-live="polite">
      <div class="emoji-grande" aria-hidden="true">🛡️</div>
      <div class="safety-note" role="note">
        <span aria-hidden="true">🛟</span>
        <p data-i18n="safetyNote">Si algo parecido te ha ocurrido, no es tu culpa. Para, guarda las pruebas y pide ayuda a una persona de confianza.</p>
      </div>
      <p id="transferencia" class="transferencia" data-i18n="transferencia"></p>
      <h2 data-i18n="roundComplete">Tema completado</h2>
      <p id="endText"></p>
      <p id="resumenFinal"></p>
      <button type="button" class="btn" id="btnRepeat" data-i18n="repeat">Practicar otra vez</button>
      <button type="button" class="btn btn-secondary" id="btnOtroTemaFin" data-i18n="anotherTopic">Elegir otro tema</button>
      <button type="button" class="btn btn-secondary" id="btnVerTodasFin" data-i18n="verTodas">Ver todos los casos</button>
    </section>

    <section id="listScreen" class="hidden pila" aria-live="polite">
      <div class="row centered-row">
        <button type="button" class="btn btn-secondary" id="btnVolverJugar" data-i18n="volverJugar">Volver a practicar</button>
      </div>
      <h2 data-i18n="listaTitulo">Todos los casos</h2>
      <div id="listaTodas"></div>
    </section>
    </main>
    <footer data-suite-footer data-suite-base="../../"></footer>
  </div>

  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script src="../../assets/js/storage.js"></script>
  <script src="../../assets/js/feedback.js"></script>
  <script src="strings.es.js"></script>
  <script src="strings.en.js"></script>
  <script src="data.js"></script>
  <script src="../../assets/js/stars-engine.js"></script>
  <script src="../../assets/js/stars-strings.js"></script>
  <script src="../../assets/js/activity-glue.js"></script>
  <script src="app.js"></script>
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('../../sw.js').catch(function () {});</script>
<script src="../../assets/js/sw-update.js" defer></script>
  <script src="../../assets/js/locale-picker-config.js"></script>
  <script src="../../assets/js/locale-picker.js" defer></script>
  <script src="../../assets/js/suite-chrome.js"></script>
</body>
</html>
