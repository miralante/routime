<!DOCTYPE html>
<html lang="es" data-i18n-title="title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Situaciones | Routime</title>
  <meta name="theme-color" content="#FAF7F2">
  <link rel="stylesheet" href="../../assets/css/tokens.css?v=routime-v32fbcfdc">
  <link rel="stylesheet" href="../../assets/css/base.css?v=routime-v24767fa6">
  <link rel="stylesheet" href="../../assets/css/components.css?v=routime-v962b12ea">
  <link rel="stylesheet" href="styles.css?v=routime-v0483548e">
</head>
<body>
  <div class="container">
    <header class="tool-header">
      <a href="../../" class="back-link" data-i18n="core.back">← Volver</a>
      <h1 data-i18n="title">Situaciones</h1>
      <span class="stars" id="stars">⭐ 0</span>
    </header>

    <section id="menuScreen" class="hidden pila">
      <p class="instruccion centered" data-i18n="instruccion">Elige una subactividad para practicar.</p>
      <div id="menuNiveles" class="pila"></div>
    </section>

    <section id="gameScreen" class="hidden pila centered">

      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
        <span class="progress-text" id="progressText"></span>
        <span class="dificultad" id="level"></span>
      </div>
      <div class="card centered stack">
        <span id="situacionPicto" class="picto-situacion"></span>
        <p id="situacionTexto" class="situacion-text"></p>
      </div>
      <div class="options stack" id="options"></div>
      <div class="feedback" id="feedback" aria-live="polite"></div>
      <div class="row explanation hidden" id="explanationWrap">
        <p id="explanation" aria-live="polite"></p>
      </div>
      <button type="button" class="btn hidden" id="btnNext">Siguiente &#8594;</button>
      <button type="button" class="btn btn-secondary" id="btnVerTodas" data-i18n="verTodas">Ver todas las situaciones</button>
      <button type="button" class="btn btn-secondary" id="btnMenuJuego" data-i18n="btnMenu">Volver al menú</button>
    </section>

      <section id="endScreen" class="hidden centered pila" aria-live="polite">
        <div class="emoji-grande" aria-hidden="true">&#x1F38A;</div>
        <h2>Ronda completada!</h2>
        <p id="endSummary"></p>
        <button type="button" class="btn" id="repeatBtn">Jugar otra vez</button>
        <button type="button" class="btn btn-secondary" id="btnVerTodasFin" data-i18n="verTodas">Ver todas las situaciones</button>
        <button type="button" class="btn btn-secondary" id="btnMenuFin" data-i18n="btnMenu">Volver al menú</button>
      </section>

      <section id="listScreen" class="hidden pila" aria-live="polite">
        <div class="row centered-row">
          <button type="button" class="btn btn-secondary" id="btnVolverJugar" data-i18n="volverJugar">Volver a jugar</button>
        </div>
        <h2 data-i18n="listaTitulo">Todas las situaciones</h2>
        <div id="listaTodas"></div>
      </section>
    <footer data-pie-app data-pie-base="../../" data-pie-class="pie-app"></footer>
  </div>

  <script src="../../assets/js/utils.js?v=routime-v32a47fbd"></script>
  <script src="../../assets/js/i18n.js?v=routime-v729f90fb"></script>
  <script src="../../assets/js/storage.js?v=routime-veaa669aa"></script>
  <script src="../../assets/js/feedback.js?v=routime-v93b35d8d"></script>
  <script src="strings.es.js?v=routime-vbb8b601d"></script>
  <script src="strings.en.js?v=routime-v6277000b"></script>
  <script src="data.js?v=routime-v03ea9049"></script>
  <script src="app.js?v=routime-vb821edc5"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register("../../sw.js").catch(function () {});
    }
  </script>
<script src="../../assets/js/sw-update.js?v=routime-v6d6b3d4b" defer></script>
</body>
</html>
