<!DOCTYPE html>
<html lang="es" data-i18n-title="title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Une los Puntos | Routime</title>
  <meta name="theme-color" content="#FAF7F2">
  <link rel="stylesheet" href="../../assets/css/tokens.css?v=routime-vbb11c750">
  <link rel="stylesheet" href="../../assets/css/base.css?v=routime-v24767fa6">
  <link rel="stylesheet" href="../../assets/css/components.css?v=routime-v962b12ea">
  <link rel="stylesheet" href="styles.css?v=routime-v2d392b3c">
</head>
<body>
  <div class="container">
    <header class="tool-header">
      <a href="../../" class="back-link" data-i18n="core.back">← Volver</a>
      <h1 data-i18n="title">🔢 Une los Puntos</h1>
      <span class="stars" id="stars">⭐ 0</span>
    </header>

    <!-- Game screen -->
    <section id="playScreen" class="pila">
      <div class="row center-row">
        <p class="instruction" id="instructionText" data-i18n="instruction">Toca los números en orden, del 1 hasta el final, para dibujar la figura.</p>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
        <span class="progress-text" id="progressText">0 / 5</span>
      </div>
      <div class="feedback" id="feedback" aria-live="polite"></div>
      <div id="playArea" data-i18n-aria="playAreaAria" aria-label="Zona de juego. Toca los números en orden.">
        <svg id="linesSvg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
      </div>
    </section>

    <!-- End screen -->
    <section id="finishScreen" class="hidden centered pila" aria-live="polite">
      <div class="big-emoji" id="finishEmoji" aria-hidden="true">🎉</div>
      <h2 data-i18n="core.roundComplete">¡Ronda completada!</h2>
      <p id="finishText"></p>
      <p id="transfer" class="transferencia" data-i18n="transfer"></p>
      <button type="button" class="btn" id="playAgainBtn" data-i18n="core.playAgain">Jugar otra vez</button>
      <a href="../../" class="btn btn-secondary" data-i18n="core.backToMenu">Volver al menú</a>
    </section>
    <footer data-pie-app data-pie-base="../../" data-pie-class="pie-app"></footer>
  </div>

  <script src="../../assets/js/utils.js?v=routime-v32a47fbd"></script>
  <script src="../../assets/js/i18n.js?v=routime-v729f90fb"></script>
  <script src="../../assets/js/storage.js?v=routime-veaa669aa"></script>
  <script src="../../assets/js/feedback.js?v=routime-v93b35d8d"></script>
  <script src="strings.es.js?v=routime-vc20500db"></script>
  <script src="strings.en.js?v=routime-vb3d204e6"></script>
  <script src="data.js?v=routime-v01ac6ce7"></script>
  <script src="app.js?v=routime-vb2a72bdf"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../../sw.js').catch(function () {});
    }
  </script>
<script src="../../assets/js/sw-update.js?v=routime-v6d6b3d4b" defer></script>
</body>
</html>
