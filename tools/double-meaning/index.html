<!DOCTYPE html>
<html lang="es" data-i18n-title="title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doble Sentido | Routime</title>
  <meta name="theme-color" content="#FAF7F2">
  <link rel="stylesheet" href="../../assets/css/tokens.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="tool-header">
      <a href="../../site/index.html" class="back-link" data-i18n="core.back">← Volver</a>
      <h1 data-i18n="title">👀 Doble Sentido</h1>
      <span class="stars" id="stars">⭐ 0</span>
    </header>

    <!-- Pantalla inicial -->
    <section id="startScreen" class="pila centered">
      <div class="row center-row">
        <p class="instruction" id="instructionText" data-i18n="instruction">Algunas words pueden significar dos cosas distintas. Escucha la frase y decide si tiene un significado o dos.</p>
      </div>
      <span class="dificultad" id="dificultad" aria-live="polite"></span>
      <button type="button" class="btn btn-principal" id="btnPlay">
        <span data-i18n="btnJugar">¡Jugar!</span>
      </button>
    </section>

    <!-- Game screen -->
    <section id="quizScreen" class="hidden pila">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
        <span class="progress-text" id="progressText">0 / 8</span>
      </div>
      <div class="card centered pila">
        <div class="sentence-picto" aria-hidden="true">💬</div>
        <p class="sentence-text" id="sentenceText" data-i18n="core.loading">Cargando…</p>      </div>
      <h2 class="question centered" data-i18n="question">¿Esta frase tiene doble sentido?</h2>
      <div class="pila" id="options"></div>
      <div class="feedback" id="feedback" aria-live="polite"></div>
      <div class="row explicacion hidden" id="explanationWrap">
        <p id="explanation" aria-live="polite"></p>      </div>
      <button type="button" class="btn hidden" id="nextBtn" data-i18n="core.next" data-i18n-aria="core.nextAria">→</button>
    </section>

    <!-- End screen -->
    <section id="endScreen" class="hidden centered pila" aria-live="polite">
      <div class="big-emoji" aria-hidden="true">🎉</div>
      <h2 data-i18n="core.roundComplete">¡Ronda completada!</h2>
      <p id="finalSummary"></p>
      <p id="resumenFinal"></p>
      <p id="transferencia" class="transferencia" data-i18n="transferencia"></p>
      <button type="button" class="btn" id="btnRepeat" data-i18n="core.playAgain">Jugar otra vez</button>
      <a href="../../site/index.html" class="btn btn-secondary" data-i18n="core.backToMenu">Volver al menú</a>
    </section>
    <footer data-pie-app data-pie-base="../../" data-pie-class="pie-app"></footer>
  </div>

  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script src="../../assets/js/storage.js"></script>
  <script src="../../assets/js/feedback.js"></script>
  <script src="strings.es.js"></script>
  <script src="strings.en.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../../sw.js').catch(function () {});
    }
  </script>
</body>
</html>
