    <header class="tool-header">
      <a href="../../" class="back-link" data-i18n="core.back">← Volver</a>
      <h1 data-i18n="title">🚨 Alerta Phishing</h1>
      <span class="stars" id="stars">⭐ 0</span>
    </header>

    <!-- Screen: chat menu -->
    <section id="menuScreen" class="pila">
      <div class="row centered-row">
        <p class="instruccion centered" id="instruccion" data-i18n="instruccion">Practica cómo detectar correos falsos, enlaces sospechosos y archivos adjuntos peligrosos.</p>
      </div>
      <div class="cards-grid" id="listaChats"></div>
    </section>

    <!-- Pantalla: mis normas -->
    <section id="pantallaNormas" class="hidden pila">
      <div class="row">
        <button type="button" class="btn btn-secondary" id="btnVolverDeNormas" data-i18n="volverChats">← Chats</button>
        <h2 class="titulo-seccion" data-i18n="normasTitulo">Mis normas</h2>
      </div>
      <p class="instruccion" data-i18n="instruccionNormas">Estas normas te protegen de correos y mensajes peligrosos.</p>
      <div class="pila" id="listaNormas"></div>
    </section>

    <!-- Pantalla: chat -->
    <section id="pantallaChat" class="hidden pila">
      <div class="row">
        <button type="button" class="btn btn-secondary" id="btnSalirChat" data-i18n="volverChats">← Chats</button>
        <div class="chat-contacto">
          <span class="chat-avatar" id="chatAvatar" aria-hidden="true">📧</span>
          <span class="pila-mini">
            <span class="chat-alias" id="chatAlias" data-i18n="desconocado">Remitente desconocido</span>
            <span class="chat-badge" id="chatTipo">📧 Correo electrónico</span>
          </span>
        </div>
      </div>

      <div class="chat-marco">
        <div class="chat-mensajes pila" id="chatMensajes"></div>
      </div>

      <div class="feedback" id="feedback" aria-live="polite"></div>

      <div class="consejo hidden" id="consejo">
        <p id="consejoTexto"></p>
      </div>

      <div class="consejo consejo-seguro hidden" id="consejoSeguro">
        <p id="consejoSeguroTexto"></p>
      </div>

      <p class="pregunta centered hidden" id="chatPregunta" data-i18n="chatPregunta">¿Qué respondes?</p>
      <div class="pila" id="chatOpciones"></div>

      <div class="regla-final hidden" id="reglaFinal">
        <h3 data-i18n="reglaFinalTitulo">⭐ Para recordar</h3>
        <p id="reglaTexto"></p>
        <p class="nota-segura" id="notaSegura"></p>
        <div class="row centered-row">
          <button type="button" class="btn" id="btnBackToMenu" data-i18n="volverAChats">Volver a los chats</button>
        </div>
      </div>
    </section>
    <footer data-suite-footer data-suite-base="../../" data-suite-settings></footer>
