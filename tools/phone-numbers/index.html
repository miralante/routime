<!DOCTYPE html>
<html lang="es" data-i18n-title="title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teléfonos Importantes | Routime</title>
  <meta name="theme-color" content="#FAF7F2">
  <link rel="stylesheet" href="../../assets/css/tokens.css?v=routime-vbb11c750">
  <link rel="stylesheet" href="../../assets/css/base.css?v=routime-v24767fa6">
  <link rel="stylesheet" href="../../assets/css/components.css?v=routime-v962b12ea">
  <link rel="stylesheet" href="styles.css?v=routime-v9e0661f6">
</head>
<body>
  <div class="container">
    <header class="tool-header">
      <a href="../../" class="back-link" data-i18n="core.back">← Volver</a>
      <h1 data-i18n="title">📞 Teléfonos Importantes</h1>
      <span class="stars" id="stars">⭐ 0</span>
    </header>

    <!-- Pantalla 1: fichas -->
    <section id="cardsScreen" class="pila centered">
      <div class="row center-row">
        <p class="instruction" data-i18n="instruction">Aprende qué número marcar. Primero mira las fichas, luego el resumen y después haz el test.</p>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="cardsProgressFill"></div>
        <span class="progress-text" id="cardsProgressText">1 / 3</span>
      </div>
      <div class="card centered pila">
        <div class="card-picto" id="cardPicto" aria-hidden="true"></div>
        <h2 id="cardName"></h2>
        <p class="card-situation" id="cardSituation"></p>
        <p class="card-number" id="cardNumber"></p>      </div>
      <button type="button" class="btn" id="nextCardBtn" data-i18n="core.next" data-i18n-aria="core.nextAria">→</button>
    </section>

    <!-- Pantalla 2: resumen -->
    <section id="summaryScreen" class="hidden pila centered">
      <h2 data-i18n="summaryTitle">Un solo número para todo</h2>
      <div class="card pila" id="summaryCard"></div>
      <div class="row center-row">      </div>
      <button type="button" class="btn" id="startQuizBtn" data-i18n="startQuiz">Hacer el test</button>
    </section>

    <!-- Pantalla 3: test -->
    <section id="quizScreen" class="hidden pila">
      <div class="progress-bar">
        <div class="progress-fill" id="quizProgressFill"></div>
        <span class="progress-text" id="quizProgressText">0 / 8</span>
      </div>
      <div class="card centered pila">
        <div class="situation-picto" id="quizPicto" aria-hidden="true"></div>
        <p class="quiz-text" id="quizSituation" data-i18n="core.loading">Cargando…</p>      </div>
      <h2 class="quiz-question centered" data-i18n="quizQuestion">¿A qué número llamas?</h2>
      <div class="pila" id="quizOptions"></div>
      <div class="feedback" id="quizFeedback" aria-live="polite"></div>
      <div class="row explicacion hidden" id="quizExplanationWrap">
        <p id="quizExplanation" aria-live="polite"></p>      </div>
      <button type="button" class="btn hidden" id="quizNextBtn" data-i18n="core.next" data-i18n-aria="core.nextAria">→</button>
    </section>

    <!-- End screen -->
    <section id="endScreen" class="hidden centered pila" aria-live="polite">
      <div class="big-emoji" aria-hidden="true">🎉</div>
      <h2 data-i18n="core.roundComplete">¡Ronda completada!</h2>
      <p id="finalSummary"></p>
      <p id="transferencia" class="transferencia" data-i18n="transferencia"></p>
      <button type="button" class="btn" id="replayBtn" data-i18n="core.playAgain">Jugar otra vez</button>
      <a href="../../" class="btn btn-secondary" data-i18n="core.backToMenu">Volver al menú</a>
    </section>
    <footer data-pie-app data-pie-base="../../" data-pie-class="pie-app"></footer>
  </div>

  <script src="../../assets/js/utils.js?v=routime-v32a47fbd"></script>
  <script src="../../assets/js/i18n.js?v=routime-v729f90fb"></script>
  <script src="../../assets/js/storage.js?v=routime-veaa669aa"></script>
  <script src="../../assets/js/feedback.js?v=routime-v93b35d8d"></script>
  <script src="strings.es.js?v=routime-v324d0c9e"></script>
  <script src="strings.en.js?v=routime-vf2aa039c"></script>
  <script src="data.js?v=routime-v766f35d5"></script>
  <script src="app.js?v=routime-vfc85b2d8"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../../sw.js').catch(function () {});
    }
  </script>
<script src="../../assets/js/sw-update.js?v=routime-v6d6b3d4b" defer></script>
</body>
</html>
