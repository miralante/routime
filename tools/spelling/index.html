<!DOCTYPE html>
<html lang="es" data-i18n-title="title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Completa la Palabra | Routime</title>
  <meta name="theme-color" content="#FAF7F2">
    <link rel="stylesheet" href="../../assets/css/brand.css">
  <link rel="stylesheet" href="../../assets/css/tokens.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/locale-picker.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div data-suite-header data-suite-logo="../../assets/img/icono.svg" data-suite-byline></div>
    <div class="suite-chrome-activity" data-suite-activity>
      <a href="../../" class="back-link" data-i18n="core.back">← Volver</a>
      <h1 data-i18n="title">🔡 Completa la Palabra</h1>
    </div>
    <main class="suite-body">
    <span class="stars" data-suite-stars id="stars">⭐ 0</span>

    <!-- Pantalla inicial -->
    <section id="startScreen" class="hidden pila centered">
      <div class="row center-row">
        <p class="instruction" id="instructionText" data-i18n="instruction">Mira la palabra y elige la letra que falta para escribirla bien.</p>
      </div>
      <span class="dificultad" id="dificultad" aria-live="polite"></span>
      <button type="button" class="btn btn-principal" id="btnPlay">
        <span data-i18n="btnJugar">¡Jugar!</span>
      </button>
    </section>

    <!-- Game screen -->
    <section id="quizScreen" class="hidden pila">
      <div class="progress-bar" data-suite-progress>
        <div class="progress-fill" id="progressFill"></div>
        <span class="progress-text" id="progressText">0 / 8</span>
      </div>
      <div class="card centered pila">
        <div class="word-picto" id="wordPicto" aria-hidden="true"></div>
        <div class="word-tiles" id="wordTiles"></div>      </div>
      <div class="pila row-options" id="options"></div>
      <div class="feedback" id="feedback" aria-live="polite"></div>
      <div class="row explicacion hidden" id="explanationWrap">
        <p id="explanation" aria-live="polite"></p>      </div>
      <button type="button" class="btn hidden" id="nextBtn" data-i18n="core.next" data-i18n-aria="core.nextAria">→</button>
    </section>

    <!-- End screen -->
    <section id="endScreen" class="hidden centered pila" aria-live="polite">
      <div class="big-emoji" aria-hidden="true">🎉</div>
      <h2 data-i18n="core.roundComplete">¡Ronda completada!</h2>
      <p id="finalSummary"></p>
      <p id="resumenFinal"></p>
      <p id="transferencia" class="transferencia" data-i18n="transferencia"></p>
      <button type="button" class="btn" id="btnRepeat" data-i18n="core.playAgain">Jugar otra vez</button>
    </section>
    </main>
    <footer data-suite-footer data-suite-base="../../"></footer>
  </div>

  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script src="../../assets/js/storage.js"></script>
  <script src="../../assets/js/feedback.js"></script>
  <script src="strings.es.js"></script>
  <script src="strings.en.js"></script>
  <script src="data.js"></script>
  <script src="../../assets/js/stars-engine.js"></script>
  <script src="../../assets/js/stars-strings.js"></script>
  <script src="../../assets/js/activity-glue.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../../sw.js').catch(function () {});
    }
  </script>
<script src="../../assets/js/sw-update.js" defer></script>
  <script src="../../assets/js/locale-picker-config.js"></script>
  <script src="../../assets/js/locale-picker.js" defer></script>
  <script src="../../assets/js/suite-chrome.js"></script>
</body>
</html>
