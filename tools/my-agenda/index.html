<!DOCTYPE html>
<html lang="es" data-i18n-title="title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi agenda | Routime</title>
  <meta name="theme-color" content="#FAF7F2">
  <link rel="stylesheet" href="../../assets/css/tokens.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="tool-header">
      <a href="../../site/index.html" class="back-link" data-i18n="core.back">← Volver</a>
      <h1 data-i18n="title">📅 Mi agenda</h1>
      <span class="stars" id="stars" aria-live="polite">⭐ 0</span>
    </header>

    <main>
      <section id="startScreen" class="pila centrado">
        <div class="fila centered-row">
          <p class="instruction" id="instruction" data-i18n="instruction">Elige el plan que está bien preparado.</p>
        </div>
        <h2 id="levelHeading" tabindex="-1" data-i18n="chooseLevel">Elige el nivel</h2>
        <div class="pila" id="levels"></div>
      </section>

      <section id="caseScreen" class="oculto pila" aria-labelledby="questionHeading">
        <div class="progress-bar" aria-hidden="true">
          <div class="progress-fill" id="progressFill"></div>
          <span class="progress-text" id="progressText">1 / 5</span>
        </div>

        <article class="card case-card centrado pila">
          <div class="case-icon" id="caseIcon" aria-hidden="true">📅</div>
          <p class="case-text" id="caseText" data-i18n="core.loading">Cargando…</p>
        </article>

        <h2 class="question centrado" id="questionHeading" data-i18n="question">¿Qué plan eliges?</h2>
        <div class="pila" id="options"></div>
        <div class="feedback" id="feedback" aria-live="polite"></div>
        <div class="fila explicacion oculto" id="explanationWrap">
          <p id="explanation" aria-live="polite"></p>
        </div>
        <button type="button" class="btn next-button oculto" id="nextButton" data-i18n="core.next" data-i18n-aria="core.nextAria">→</button>
      </section>

      <section id="endScreen" class="oculto pila centrado" aria-labelledby="endHeading">
        <div class="end-icon" aria-hidden="true">🎉</div>
        <h2 id="endHeading" tabindex="-1" data-i18n="core.roundComplete">¡Ronda completada!</h2>
        <div class="fila centered-row">
          <p id="endText" aria-live="polite"></p>
        </div>
        <button type="button" class="btn" id="repeatButton" data-i18n="core.playAgain">Jugar otra vez</button>
        <p id="transferencia" class="transferencia" data-i18n="transferencia"></p>
        <button type="button" class="btn btn-secundario" id="levelsButton" data-i18n="chooseAnotherLevel">Elegir otro nivel</button>
        <a href="../../site/index.html" class="btn btn-secundario" data-i18n="core.backToMenu">Volver al menú</a>
      </section>
    </main>
    <footer data-pie-app data-pie-base="../../" data-pie-class="pie-app"></footer>
  </div>

  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script src="../../assets/js/storage.js"></script>
  <script src="../../assets/js/feedback.js"></script>
  <script>
    (function () {
      var locale = window.App.i18n.locale();
      document.write('<script src="strings.' + locale + '.js?v=' + Date.now() + '"><\/script>');
    })();
  </script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../../sw.js').catch(function () {});
    }
  </script>
</body>
</html>
