<!DOCTYPE html>
<html lang="es" data-i18n-title="title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Rutinas | Routime</title>
  <meta name="theme-color" content="#FAF7F2">
  <link rel="stylesheet" href="../../assets/css/tokens.css?v=routime-v3bce">
  <link rel="stylesheet" href="../../assets/css/base.css?v=routime-v3bce">
  <link rel="stylesheet" href="../../assets/css/components.css?v=routime-v3bce">
  <link rel="stylesheet" href="styles.css?v=routime-v3bce">
</head>
<body>
  <div class="container">
    <header class="tool-header">
      <a href="../../site/index.html" class="back-link" id="btnBack" data-i18n="core.back">← Volver</a>
      <h1 data-i18n="title">📋 Mis Rutinas</h1>
      <span class="stars" id="stars">⭐ 0</span>
    </header>

    <div class="routine-tabs" role="tablist" aria-label="Secciones de rutinas">
      <button type="button" class="routine-tab activa" id="predefinedTab" role="tab" aria-selected="true" aria-controls="menuScreen" data-i18n="predefinedTab">Rutinas predefinidas</button>
      <button type="button" class="routine-tab" id="ownTab" role="tab" aria-selected="false" aria-controls="freeListScreen" data-i18n="ownTab">Mis listas</button>
    </div>

    <!-- Routine menu -->
    <section id="menuScreen" class="pila">
      <div id="routinesList" class="routines-list"></div>
    </section>

    <!-- Vista de una rutina -->
    <section id="routineScreen" class="hidden pila">
      <h2 id="routineTitle" class="centered"></h2>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <ol id="stepsList" class="pila"></ol>
      <div class="feedback" id="feedback" aria-live="polite"></div>
    </section>

    <!-- Ordenar steps de una rutina -->
    <section id="orderScreen" class="hidden pila">
      <h2 id="orderTitle" class="centered"></h2>
      <p class="instruccion centered" id="orderInstruction" data-i18n="orderInstruction">Toca los steps en el orden correct, de primero a último.</p>

      <div class="orden-dos-columnas">
        <div class="orden-col orden-col-tu">
          <p class="etiqueta centered" data-i18n="labelYourOrder">Tu orden</p>
          <ol id="slotsList" class="slots-stack"></ol>
          <div class="move-slot-bar" role="group" aria-label="Mover el slot selected">
            <button type="button" class="btn-arrow-slot btn-move-slot-up" id="btnMoveStepUp" aria-label="Subir el paso selected" disabled>↑</button>
            <button type="button" class="btn-arrow-slot btn-move-slot-down" id="btnMoveStepDown" aria-label="Bajar el paso selected" disabled>↓</button>
          </div>
        </div>
        <div class="orden-col orden-col-steps">
          <p class="etiqueta centered" data-i18n="labelAvailableSteps">Pasos</p>
          <div id="availableStepsList" class="available-stack"></div>
        </div>
      </div>

      <div class="row centered">
        <button type="button" class="btn" id="btnCheck" data-i18n="btnCheck">Comprobar</button>
        <button type="button" class="btn btn-secondary" id="btnHintOrder" data-i18n="btnHint">💡 Pista</button>
        <button type="button" class="btn btn-secondary" id="btnResolveOrder" data-i18n="btnResolve">Ver solución</button>
      </div>
      <div class="feedback" id="orderFeedback" aria-live="polite"></div>
    </section>

    <!-- Crea tu lista libre -->
    <section id="freeListScreen" class="hidden pila" role="tabpanel" aria-labelledby="ownTab">
      <h2 data-i18n="freeListTitle">📝 Crea tu lista</h2>
      <p class="instruccion centered" data-i18n="freeListInstruction">Escribe las cosas de tu lista. Tú decides el orden.</p>
      <p class="transferencia centered" data-i18n="freeListTransfer"></p>

      <div id="editingNotice" class="editing-notice hidden">
        <span id="editingNoticeText"></span>
        <button type="button" class="btn-cancel-edit" id="btnCancelEdit" data-i18n="btnCancelEdit">Cancelar edición</button>
      </div>

      <ul id="currentListItems" class="lista-items-current"></ul>

      <div class="add-item-row">
        <input type="text" id="inputNewItem" class="input-list" maxlength="60" autocomplete="off">
        <button type="button" class="btn" id="btnAddItem" data-i18n="btnAddItem">➕ Añadir</button>
      </div>

      <div class="row centered">
        <button type="button" class="btn" id="btnSaveList" data-i18n="btnSaveList" disabled>💾 Guardar lista</button>
        <button type="button" class="btn btn-secondary" id="btnClearList" data-i18n="btnClearList" data-i18n-aria="ariaVaciarLista">🗑️ Vaciar</button>
      </div>

      <div id="nameList" class="name-list hidden pila">
        <label for="inputListName" class="instruccion centered" data-i18n="promptListName">¿Cómo quieres llamar a tu lista?</label>
        <input id="inputListName" class="input-list-name" type="text" maxlength="30" autocomplete="off" data-i18n-aria="ariaNombreLista">
        <div class="row centered">
          <button type="button" class="btn" id="btnConfirmSaveList" data-i18n="btnConfirmSaveList">✅ Guardar</button>
        </div>
      </div>

      <div class="feedback" id="freeListFeedback" aria-live="polite"></div>

      <div id="savedLists" class="saved-lists"></div>
    </section>

    <!-- Rutina completada -->
    <section id="endScreen" class="hidden centered pila" aria-live="polite">
      <div class="emoji-grande" aria-hidden="true">🎉</div>
      <h2 data-i18n="routineCompletedTitle">¡Rutina completada!</h2>
      <p id="resumenFinal"></p>
      <p id="transferencia" class="transferencia" data-i18n="transferencia"></p>
      <button type="button" class="btn" id="btnAnotherRoutine" data-i18n="btnAnotherRoutine">Ver mis rutinas</button>
      <a href="../../site/index.html" class="btn btn-secondary" data-i18n="core.backToMenu">Volver al menú</a>
    </section>
    <footer data-pie-app data-pie-base="../../" data-pie-class="pie-app"></footer>
  </div>

  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script src="../../assets/js/storage.js"></script>
  <script src="../../assets/js/feedback.js"></script>
  <script src="strings.es.js"></script>
  <script src="strings.en.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../../sw.js').catch(function () {});
    }
  </script>
</body>
</html>
