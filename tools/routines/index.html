<!DOCTYPE html>
<html lang="es" data-i18n-title="title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Rutinas | Routime</title>
  <meta name="theme-color" content="#FAF7F2">
  <link rel="stylesheet" href="../../assets/css/tokens.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="tool-header">
      <a href="../../site/index.html" class="back-link" id="btnVolver" data-i18n="core.back">← Volver</a>
      <h1 data-i18n="title">📋 Mis Rutinas</h1>
      <span class="stars" id="stars">⭐ 0</span>
    </header>

    <div class="pestanas-rutinas" role="tablist" aria-label="Secciones de rutinas">
      <button type="button" class="pestana-rutinas activa" id="tabPredefinidas" role="tab" aria-selected="true" aria-controls="pantallaMenu" data-i18n="tabPredefinidas">Rutinas predefinidas</button>
      <button type="button" class="pestana-rutinas" id="tabPropias" role="tab" aria-selected="false" aria-controls="pantallaListaLibre" data-i18n="tabPropias">Mis listas</button>
    </div>

    <!-- Routine menu -->
    <section id="pantallaMenu" class="pila">
      <div id="listaRutinas" class="lista-rutinas"></div>
    </section>

    <!-- Vista de una rutina -->
    <section id="pantallaRutina" class="oculto pila">
      <h2 id="tituloRutina" class="centrado"></h2>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <ol id="listaPasos" class="pila"></ol>
      <div class="feedback" id="feedback" aria-live="polite"></div>
    </section>

    <!-- Ordenar pasos de una rutina -->
    <section id="pantallaOrdenar" class="oculto pila">
      <h2 id="tituloOrdenar" class="centrado"></h2>
      <p class="instruccion centrado" id="instruccionOrdenar" data-i18n="instruccionOrdenar">Toca los pasos en el orden correcto, de primero a último.</p>

      <div class="orden-dos-columnas">
        <div class="orden-col orden-col-tu">
          <p class="etiqueta centrado" data-i18n="etiquetaTuOrden">Tu orden</p>
          <ol id="listaSlots" class="pila-slots"></ol>
          <div class="barra-mover-slot" role="group" aria-label="Mover el slot seleccionado">
            <button type="button" class="btn-flecha-slot btn-subir-slot" id="btnSubirPaso" aria-label="Subir el paso seleccionado" disabled>↑</button>
            <button type="button" class="btn-flecha-slot btn-bajar-slot" id="btnBajarPaso" aria-label="Bajar el paso seleccionado" disabled>↓</button>
          </div>
        </div>
        <div class="orden-col orden-col-pasos">
          <p class="etiqueta centrado" data-i18n="etiquetaPasosDisponibles">Pasos</p>
          <div id="listaPasosDisponibles" class="pila-disponibles"></div>
        </div>
      </div>

      <div class="fila centrado">
        <button type="button" class="btn" id="btnComprobar" data-i18n="btnComprobar">Comprobar</button>
        <button type="button" class="btn btn-secundario" id="btnPistaOrdenar" data-i18n="btnPista">💡 Pista</button>
        <button type="button" class="btn btn-secundario" id="btnResolverOrdenar" data-i18n="btnResolver">Ver solución</button>
      </div>
      <div class="feedback" id="feedbackOrdenar" aria-live="polite"></div>
    </section>

    <!-- Crea tu lista libre -->
    <section id="pantallaListaLibre" class="oculto pila" role="tabpanel" aria-labelledby="tabPropias">
      <h2 data-i18n="listaLibreTitulo">📝 Crea tu lista</h2>
      <p class="instruccion centrado" data-i18n="listaLibreInstruccion">Escribe las cosas de tu lista. Tú decides el orden.</p>
      <p class="transferencia centrado" data-i18n="listaLibreTransferencia"></p>

      <div id="editandoAviso" class="aviso-editando oculto">
        <span id="editandoAvisoTexto"></span>
        <button type="button" class="btn-cancelar-edicion" id="btnCancelarEdicion" data-i18n="btnCancelarEdicion">Cancelar edición</button>
      </div>

      <ul id="itemsListaActual" class="lista-items-actual"></ul>

      <div class="fila-anadir-item">
        <input type="text" id="inputNuevoItem" class="input-lista" maxlength="60" autocomplete="off">
        <button type="button" class="btn" id="btnAnadirItem" data-i18n="btnAnadirItem">➕ Añadir</button>
      </div>

      <div class="fila centrado">
        <button type="button" class="btn" id="btnGuardarLista" data-i18n="btnGuardarLista" disabled>💾 Guardar lista</button>
        <button type="button" class="btn btn-secundario" id="btnVaciarLista" data-i18n="btnVaciarLista" data-i18n-aria="ariaVaciarLista">🗑️ Vaciar</button>
      </div>

      <div id="nombrarLista" class="nombrar-lista oculto pila">
        <label for="inputNombreLista" class="instruccion centrado" data-i18n="promptNombreLista">¿Cómo quieres llamar a tu lista?</label>
        <input id="inputNombreLista" class="input-nombre-lista" type="text" maxlength="30" autocomplete="off" data-i18n-aria="ariaNombreLista">
        <div class="fila centrado">
          <button type="button" class="btn" id="btnConfirmarGuardarLista" data-i18n="btnConfirmarGuardarLista">✅ Guardar</button>
        </div>
      </div>

      <div class="feedback" id="feedbackListaLibre" aria-live="polite"></div>

      <div id="listasGuardadas" class="listas-guardadas"></div>
    </section>

    <!-- Rutina completada -->
    <section id="pantallaFinal" class="oculto centrado pila" aria-live="polite">
      <div class="emoji-grande" aria-hidden="true">🎉</div>
      <h2 data-i18n="rutinaCompletadaTitulo">¡Rutina completada!</h2>
      <p id="resumenFinal"></p>
      <p id="transferencia" class="transferencia" data-i18n="transferencia"></p>
      <button type="button" class="btn" id="btnOtraRutina" data-i18n="btnOtraRutina">Ver mis rutinas</button>
      <a href="../../site/index.html" class="btn btn-secundario" data-i18n="core.backToMenu">Volver al menú</a>
    </section>
    <footer data-pie-app data-pie-base="../../" data-pie-class="pie-app"></footer>
  </div>

  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script src="../../assets/js/storage.js"></script>
  <script src="../../assets/js/feedback.js"></script>
  <script src="strings.es.js"></script>
  <script src="strings.en.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../../sw.js').catch(function () {});
    }
  </script>
</body>
</html>
