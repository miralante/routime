<!DOCTYPE html>
<html lang="es" data-i18n-title="title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trazos | Routime</title>
  <meta name="theme-color" content="#FAF7F2">
  <link rel="stylesheet" href="../../assets/css/tokens.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="tool-header">
      <a href="../../site/index.html" class="back-link" data-i18n="core.back">← Volver</a>
      <h1>✏️ <span data-i18n="title">Trazos</span></h1>
      <span class="stars" id="stars">⭐ 0</span>
    </header>

    <!-- Start screen -->
    <section id="pantallaInicio" class="pila centrado">
      <div class="fila centrado-fila">
        <p class="instruccion" id="instruccion" data-i18n="instruccion">Repasa la línea de puntos con el dedo o el ratón.</p>
      </div>
      <h2 data-i18n="elegirNivel">Elige el nivel</h2>
      <div class="pila" id="niveles"></div>
      <button type="button" class="btn btn-secundario btn-modo-libre" id="btnModoLibre" data-i18n="modoLibre">🔤 Practicar con el abecedario</button>
    </section>

    <!-- Letter selection screen (free mode) -->
    <section id="pantallaSeleccion" class="oculto pila centrado">
      <h2 data-i18n="seleccionTitulo">Elige las letras a practicar</h2>

      <div class="fila centrado-fila seleccion-atajos" role="group" aria-label="Atajos de selección">
        <button type="button" class="btn btn-secundario btn-atajo" id="btnSeleccionarMayus" data-i18n="seleccionarMayus">Mayúsculas</button>
        <button type="button" class="btn btn-secundario btn-atajo" id="btnSeleccionarMinus" data-i18n="seleccionarMinus">Minúsculas</button>
        <button type="button" class="btn btn-secundario btn-atajo" id="btnSeleccionarTodo" data-i18n="seleccionarTodo">Todas</button>
        <button type="button" class="btn btn-secundario btn-atajo" id="btnSeleccionarNada" data-i18n="seleccionarNada">Ninguna</button>
      </div>

      <fieldset class="grupo-letras">
        <legend data-i18n="mayusculas">Mayúsculas</legend>
        <div class="rejilla-letras" id="rejillaMayus" role="group" aria-label="Letras mayúsculas"></div>
      </fieldset>

      <fieldset class="grupo-letras">
        <legend data-i18n="minusculas">Minúsculas</legend>
        <div class="rejilla-letras" id="rejillaMinus" role="group" aria-label="Letras minúsculas"></div>
      </fieldset>

      <p class="seleccion-resumen" id="seleccionResumen" aria-live="polite"></p>

      <div class="fila centrado-fila acciones">
        <button type="button" class="btn btn-secundario" id="btnVolverInicio" data-i18n="core.back">← Volver</button>
        <button type="button" class="btn" id="btnIniciarPractica" data-i18n="iniciarPractica">Practicar →</button>
      </div>
    </section>

    <!-- Game screen -->
    <section id="pantallaJuego" class="oculto pila">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
        <span class="progress-text" id="progressText">0 / 6</span>
      </div>

      <p class="forma-titulo centrado" id="formaTitulo"></p>

      <div id="lienzoContenedor">
        <svg id="lienzo" viewBox="0 0 100 100" aria-label="Zona para repasar el trazo">
          <path id="guia" fill="none" />
          <path id="trazoUsuario" fill="none" />
        </svg>
      </div>

      <div class="fila centrado-fila acciones">
        <button type="button" class="btn btn-secundario" id="btnBorrar" data-i18n="borrar">🗑 Borrar</button>
        <button type="button" class="btn" id="btnComprobar" data-i18n="comprobar">Comprobar</button>
      </div>

      <div class="feedback" id="feedback" aria-live="polite"></div>
      <button type="button" class="btn oculto" id="btnSiguiente" data-i18n="core.next" data-i18n-aria="core.nextAria">→</button>
    </section>

    <!-- End screen -->
    <section id="pantallaFinal" class="oculto centrado pila" aria-live="polite">
      <div class="emoji-grande" aria-hidden="true">🎉</div>
      <h2 data-i18n="finalTitulo">¡Ronda completada!</h2>
      <p id="resumenFinal"></p>
      <p id="transferencia" class="transferencia" data-i18n="transferencia"></p>
      <button type="button" class="btn" id="btnRepetir" data-i18n="core.playAgain">Jugar otra vez</button>
      <button type="button" class="btn btn-secundario" id="btnOtroNivel" data-i18n="otroNivel">Elegir otro nivel</button>
      <a href="../../site/index.html" class="btn btn-secundario" data-i18n="core.backToMenu">Volver al menú</a>
    </section>
    <footer class="pie-app">
      <a href="../../legal/index.html" class="enlace-legal" data-i18n="core.dataProtection">Protección de datos</a>
    </footer>
  </div>

  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script src="../../assets/js/tts.js"></script>
  <script src="../../assets/js/storage.js"></script>
  <script src="../../assets/js/feedback.js"></script>
  <script src="strings.es.js"></script>
  <script src="strings.en.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../../sw.js').catch(function () {});
    }
  </script>
</body>
</html>
