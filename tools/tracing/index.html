<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Traza | Routime</title>
  <meta name="theme-color" content="#FAF7F2">
  <link rel="stylesheet" href="../../assets/css/tokens.css?v=routime-v32fbcfdc">
  <link rel="stylesheet" href="../../assets/css/base.css?v=routime-v24767fa6">
  <link rel="stylesheet" href="../../assets/css/components.css?v=routime-v6633600f">
  <link rel="stylesheet" href="../../assets/css/locale-picker.css?v=routime-vcdcf216d">
  <link rel="stylesheet" href="styles.css?v=routime-v78a2f711">
</head>
<body>
  <div class="container">
    <div data-suite-header></div>
    <header class="tool-header">
      <a href="../../" class="back-link">&larr; Volver</a>
      <h1>Routime</h1>
      <span class="stars" id="stars">&starf; 0</span>
    </header>

    <section id="startScreen" class="hidden pila centered">
      <div class="fila centered-fila">
        <p class="instruccion" data-i18n="instruccion">Pulsa Jugar para empezar.</p>
      </div>
      <button type="button" class="btn btn-principal" id="btnPlay">
        <span data-i18n="btnJugar">Jugar!</span>
      </button>
    </section>

    <section id="gameScreen" class="hidden pila centered">

      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
        <span class="progress-text" id="progressText"></span>
        <span class="dificultad" id="level"></span>
      </div>
      <div class="tracing-container">
        <div class="seleccion-screen" id="selectionScreen">
          <p id="formaTitulo" class="forma-titulo"></p>
          <div class="seleccion-botones">
            <button type="button" class="btn btn-secondary" id="btnSeleccionarMayus">Mayusculas</button>
            <button type="button" class="btn btn-secondary" id="btnSeleccionarMinus">Minusculas</button>
            <button type="button" class="btn btn-secondary" id="btnSeleccionarTodo">Todo</button>
            <button type="button" class="btn btn-secondary" id="btnSeleccionarNada">Quitar todo</button>
          </div>
          <p id="seleccionResumen" class="seleccion-resumen"></p>
          <button type="button" class="btn" id="btnIniciarPractica">Practicar</button>
          <button type="button" class="btn btn-secondary" id="btnModoLibre">Modo libre</button>
        </div>
        <div class="canvas-container">
          <div class="rejillas-container">
            <div id="rejillaMayus" class="rejilla-mayus"></div>
            <div id="rejillaMinus" class="rejilla-minus"></div>
          </div>
          <svg id="canvas" class="canvas-trazo" viewBox="0 0 400 400">
            <path id="guia" fill="none" stroke="#ccc" stroke-width="3"/>
            <path id="trazoUsuario" fill="none" stroke="var(--mod-lenguaje)" stroke-width="4" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="trazo-controles">
          <button type="button" class="btn btn-secondary" id="btnErase">Borrar</button>
          <button type="button" class="btn" id="btnComprobar">Comprobar</button>
        </div>
      </div>
      <div class="feedback" id="feedback" aria-live="polite"></div>
      <button type="button" class="btn hidden" id="btnNext">Siguiente &#8594;</button>
    </section>

      <section id="endScreen" class="hidden centered pila" aria-live="polite">
        <div class="emoji-grande" aria-hidden="true">&#x1F38A;</div>
        <h2>Ronda completada!</h2>
        <p id="endSummary"></p>
        <p class="transferencia">Sigue praticando para aprender mas.</p>
        <button type="button" class="btn" id="repeatBtn">Jugar otra vez</button>
        <button type="button" class="btn btn-secondary" id="btnMenu">Volver al inicio</button>
        <a href="../../" class="btn btn-secondary">Volver al menu</a>
      </section>
    <footer data-suite-footer data-suite-base="../../" data-suite-settings></footer>
  </div>

  <script src="../../assets/js/utils.js?v=routime-v77352015"></script>
  <script src="../../assets/js/i18n.js?v=routime-v88a87e95"></script>
  <script src="../../assets/js/storage.js?v=routime-va4fa64ee"></script>
  <script src="../../assets/js/feedback.js?v=routime-v688a6c9c"></script>
  <script src="strings.es.js?v=routime-v2e64f90f"></script>
  <script src="strings.en.js?v=routime-v26e90222"></script>
  <script src="data.js?v=routime-v4da7f11d"></script>
  <script src="../../assets/js/stars-engine.js?v=routime-v8d4a7ee6"></script>
  <script src="../../assets/js/stars-strings.js?v=routime-v37bc0c34"></script>
  <script src="../../assets/js/activity-glue.js?v=routime-v688dd286"></script>
  <script src="app.js?v=routime-v6993f180"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register("../../sw.js").catch(function () {});
    }
  </script>
<script src="../../assets/js/sw-update.js?v=routime-v6d6b3d4b" defer></script>
  <script src="../../assets/js/locale-picker-config.js?v=routime-v455c271e"></script>
  <script src="../../assets/js/locale-picker.js?v=routime-v8851c7df" defer></script>
  <script src="../../assets/js/suite-chrome.js?v=routime-v40aa8123"></script>
</body>
</html>
