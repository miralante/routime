<!DOCTYPE html>
<html lang="es" data-i18n-title="title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atrapa | Routime</title>
  <meta name="theme-color" content="#FAF7F2">
  <link rel="stylesheet" href="../../assets/css/tokens.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="tool-header">
      <a href="../../site/index.html" class="back-link" data-i18n="core.back">← Volver</a>
      <h1 data-i18n="title">⚽ Atrapa</h1>
      <span class="stars" id="stars">⭐ 0</span>
    </header>

    <!-- Game screen -->
    <section id="pantallaJuego" class="pila">
      <div class="fila centrado-fila">
        <p class="instruccion" id="instruccion" data-i18n="instruccion">Toca el dibujo. Se mueve cuando lo tocas.</p>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
        <span class="progress-text" id="progressText">0 / 10</span>
      </div>
      <div class="feedback" id="feedback" aria-live="polite"></div>
      <div id="areaJuego" data-i18n-aria="areaJuegoAria" aria-label="Zona de juego. Toca el dibujo.">
        <button type="button" id="objetivo" data-i18n-aria="objetivoAria" aria-label="Objetivo. Tócalo.">⚽</button>
      </div>
    </section>

    <!-- End screen -->
    <section id="pantallaFinal" class="oculto centrado pila" aria-live="polite">
      <div class="emoji-grande" aria-hidden="true">🎉</div>
      <h2 data-i18n="rondaCompletadaTitulo">¡Ronda completada!</h2>
      <p id="resumenFinal"></p>
      <p id="transfer" class="transferencia" data-i18n="transfer"></p>
      <button type="button" class="btn" id="btnRepetir" data-i18n="core.playAgain">Jugar otra vez</button>
      <a href="../../site/index.html" class="btn btn-secundario" data-i18n="core.backToMenu">Volver al menú</a>
    </section>
    <footer class="pie-app">
      <a href="../../legal/index.html" class="enlace-legal" data-i18n="core.dataProtection">Protección de datos</a>
    </footer>
  </div>

  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script src="../../assets/js/tts.js"></script>
  <script src="../../assets/js/storage.js"></script>
  <script src="../../assets/js/feedback.js"></script>
  <script src="strings.es.js"></script>
  <script src="strings.en.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../../sw.js').catch(function () {});
    }
  </script>
</body>
</html>
