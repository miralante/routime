name: Validate

# Runs the project's structural, i18n and secrets checks on every push and
# pull request. Deploys to Cloudflare Pages is handled by the Cloudflare
# Git connector reading _headers and _redirects from the repo root — this
# workflow does not deploy.
#
# None of the scripts below require npm dependencies: they all run with
# plain `node` and only use stdlib modules (fs, path, vm, child_process).
# The repo has no `package.json` (the sibling `sinonimia` project
# established this pattern) so there is nothing to install.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    name: node scripts/check.js
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: scripts/check-version-bump.js diffs against the
          # previous commit / PR base to catch a cached file changing
          # without VERSION being bumped in sw.js.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run structural and i18n checks
        run: node scripts/check.js

      - name: Check sw.js VERSION bump
        env:
          DIFF_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-version-bump.js

  i18n-smoke:
    name: i18n smoke (es/en key parity)
    runs-on: ubuntu-latest
    # The smoke reports per-tool missing keys (content gaps) but does not
    # block the pipeline: it exits 0 by default and only fails the job
    # when --strict is passed. The content session is responsible for
    # closing the gaps surfaced in the job log.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: i18n keys smoke test
        run: node scripts/i18n-keys-smoke.js

  secrets-scan:
    name: secrets scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Scan for accidentally committed secrets
        run: node scripts/scan-secrets.js
